# gitleaks configuration.
#
# The default rules are kept. The allowlist below records the findings that were
# reviewed by hand and confirmed not to be credentials, so a new finding in any
# other file still fails the scan.
#
# Reviewed on 2026-10-21 with gitleaks 8.30.1 over the whole history (244 commits):
#
#   .github/workflows/ios-build.yml, .github/workflows/testflight-status.yml,
#   .github/actions/asc-auth-probe/*   -> the literal strings
#                                         "-----BEGIN PRIVATE KEY-----" used to
#                                         reassemble a key from a GitHub secret.
#                                         No key material is present.
#   Config/Secrets.xcconfig.example    -> REPLACE_WITH_... placeholders only.
#   Shared/E2EEIdentityStore.swift     -> Swift property names such as
#                                         signingPrivateKey; the file was later
#                                         removed and held no key material.
#
# Anything else, including a real App Store Connect key, is a finding.

title = "WiFi Secure Call"

[extend]
useDefault = true

[allowlist]
description = "Reviewed false positives, documented above"
paths = [
  '''^\.github/workflows/ios-build\.yml$''',
  '''^\.github/workflows/testflight-status\.yml$''',
  '''^\.github/actions/asc-auth-probe/.*''',
  '''^Config/Secrets\.xcconfig\.example$''',
  '''^Shared/E2EEIdentityStore\.swift$''',
]
regexes = [
  '''REPLACE_WITH_[A-Z0-9_]+''',
]
