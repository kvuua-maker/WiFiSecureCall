name: WiFiSecureCallMediaDeviceProbe

options:
  minimumXcodeGenVersion: 2.46.0

settings:
  base:
    SWIFT_VERSION: 6.0
    IPHONEOS_DEPLOYMENT_TARGET: 27.0
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1

targets:
  MediaDeviceProbe:
    type: application
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: App
    info:
      path: Generated/App-Info.plist
      properties:
        CFBundleDisplayName: WiFi Secure Call Media Probe
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: AppIcon
        UILaunchScreen: {}
        MDESupportedProtocols:
          - media-device-protocol.com.vkapps.wifisecurecall.mediadeviceprobe
    entitlements:
      path: Generated/App.entitlements
      properties:
        com.apple.developer.media-device-extension:
          - media-device-protocol.com.vkapps.wifisecurecall.mediadeviceprobe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vkapps.wifisecurecall.mediadeviceprobe
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Distribution
        DEVELOPMENT_TEAM: 9V5XXDXF3N
        PROVISIONING_PROFILE_SPECIFIER: WiFiSecureCallMediaDeviceProbeAppStore
    dependencies:
      - target: MediaDeviceProbeExtension
        embed: true
    scheme: {}

  MediaDeviceProbeExtension:
    type: extensionkit-extension
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: Extension
    info:
      path: Generated/Extension-Info.plist
      properties:
        CFBundleDisplayName: WiFi Secure Call Media Probe
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.media-device-extension
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: media-device-protocol.com.vkapps.wifisecurecall.mediadeviceprobe
            UTTypeDescription: WiFi Secure Call Probe
            UTTypeConformsTo:
              - public.media-sharing-protocol
    entitlements:
      path: Generated/Extension.entitlements
      properties:
        com.apple.developer.media-device-extension:
          - media-device-protocol.com.vkapps.wifisecurecall.mediadeviceprobe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vkapps.wifisecurecall.mediadeviceprobe.extension
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Distribution
        DEVELOPMENT_TEAM: 9V5XXDXF3N
        PROVISIONING_PROFILE_SPECIFIER: WiFiSecureCallMediaDeviceExtensionAppStore
        SKIP_INSTALL: YES
