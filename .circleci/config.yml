version: 2.1

jobs:
  sdk27-carrier-probe-validation:
    macos:
      xcode: 27.0.0
    resource_class: m4pro.medium
    steps:
      - checkout
      - run:
          name: Verify authoritative SDK 27 environment
          command: |
            set -euo pipefail
            OUT=/tmp/carrier-probe-validation
            mkdir -p "$OUT"
            xcodebuild -version > "$OUT/versions.txt"
            cat "$OUT/versions.txt"
            xcrun swiftc --version >> "$OUT/versions.txt"
            IOS_SDK="$(xcrun --sdk iphoneos --show-sdk-version)"
            WATCH_SDK="$(xcrun --sdk watchos --show-sdk-version)"
            echo "IOS_SDK=$IOS_SDK" | tee -a "$OUT/versions.txt"
            echo "WATCHOS_SDK=$WATCH_SDK" | tee -a "$OUT/versions.txt"
            test "$(sed -n '1p' "$OUT/versions.txt")" = "Xcode 27.0"
            test "$(sed -n '2p' "$OUT/versions.txt")" = "Build version 27A266a"
            grep -q "Apple Swift version 6.4" "$OUT/versions.txt"
            test "$IOS_SDK" = "27.0"
            test "$WATCH_SDK" = "27.0"
      - run:
          name: Create one unsigned SDK 27 Build46 Release archive
          command: |
            set -euo pipefail
            OUT=/tmp/carrier-probe-validation
            ARCHIVE='/tmp/WiFi Secure Call Build 46.xcarchive'
            BUILD_LOG="$OUT/ios-watch-archive.log"
            test -n "${WSC_BUILD46_SECRETS_B64:-}"
            printf '%s' "$WSC_BUILD46_SECRETS_B64" | /usr/bin/base64 -D > Config/Secrets.xcconfig
            chmod 600 Config/Secrets.xcconfig
            /usr/bin/ruby -e '
              values = File.readlines(ARGV[0]).each_with_object({}) { |line, result|
                match = line.match(/^\s*(IOS_BEARER_TOKEN|WATCH_BEARER_TOKEN)\s*=\s*(.*?)\s*$/)
                result[match[1]] = match[2] if match
              }
              abort "missing protected token" unless %w[IOS_BEARER_TOKEN WATCH_BEARER_TOKEN].all? { |key|
                value = values[key]
                value && value.length >= 32 && value !~ /\s/
              }
            ' Config/Secrets.xcconfig
            xcodebuild \
              -project WiFiSecureCall.xcodeproj \
              -scheme WiFiSecureCall \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -derivedDataPath /tmp/carrier-probe-release-derived-data \
              -archivePath "$ARCHIVE" \
              CODE_SIGNING_ALLOWED=NO \
              archive | tee "$BUILD_LOG"
            APP="$ARCHIVE/Products/Applications/WiFi Secure Call.app"
            WATCH="$APP/Watch/WiFiSecureCallWatch.app"
            test "$(plutil -extract CFBundleIdentifier raw -o - "$APP/Info.plist")" = "com.vkapps.wifisecurecall"
            test "$(plutil -extract CFBundleIdentifier raw -o - "$WATCH/Info.plist")" = "com.vkapps.wifisecurecall.watchkitapp"
            test "$(plutil -extract CFBundleVersion raw -o - "$APP/Info.plist")" = "46"
            test "$(plutil -extract CFBundleVersion raw -o - "$WATCH/Info.plist")" = "46"
            for PRODUCT in "$APP" "$WATCH"; do
              test "$(plutil -extract API_BASE_URL raw -o - "$PRODUCT/Info.plist")" = "https://178.105.32.46/wifi-secure-call/v1"
              test "$(plutil -extract MEDIA_BASE_URL raw -o - "$PRODUCT/Info.plist")" = "wss://178.105.32.46/wifi-secure-call/media"
              TOKEN_LENGTH="$(plutil -extract BEARER_TOKEN raw -o - "$PRODUCT/Info.plist" | awk '{ print length($0) }')"
              test "$TOKEN_LENGTH" -ge 32
            done
            IOS_INFO="$APP/Info.plist"
            python3 -c 'import plistlib, sys; modes = plistlib.load(open(sys.argv[1], "rb")).get("UIBackgroundModes", []); assert modes.count("remote-notification") == 1; assert set(modes) == {"audio", "remote-notification", "voip"}' "$IOS_INFO"
            grep -q "CarrierCallingDiagnosticView.swift.*target 'WiFiSecureCall'" "$BUILD_LOG"
            grep -q "WatchCarrierCallingDiagnosticView.swift.*target 'WiFiSecureCallWatch'" "$BUILD_LOG"
            grep -q "target arm64-apple-ios15.0" "$BUILD_LOG"
            grep -q "target arm64.*-apple-watchos9.2" "$BUILD_LOG"
            grep -q "\*\* ARCHIVE SUCCEEDED \*\*" "$BUILD_LOG"
            ditto -c -k --sequesterRsrc --keepParent "$ARCHIVE" "$OUT/WiFiSecureCall-Build46-unsigned.xcarchive.zip"
            printf 'IOS_TYPE_CHECK=PASS\nWATCHOS_TYPE_CHECK=PASS\nWATCHOS_10_6_2_COMPATIBLE=PASS\nIOS_REMOTE_NOTIFICATION_BACKGROUND_MODE=PASS\nSDK27_UNSIGNED_ARCHIVE=PASS\n' > "$OUT/result.txt"
      - store_artifacts:
          path: /tmp/carrier-probe-validation/versions.txt
          destination: carrier-probe-validation/versions.txt
      - store_artifacts:
          path: /tmp/carrier-probe-validation/result.txt
          destination: carrier-probe-validation/result.txt
      - store_artifacts:
          path: /tmp/carrier-probe-validation/WiFiSecureCall-Build46-unsigned.xcarchive.zip
          destination: carrier-probe-validation/WiFiSecureCall-Build46-unsigned.xcarchive.zip

workflows:
  sdk27-carrier-probe-validation:
    jobs:
      - sdk27-carrier-probe-validation
