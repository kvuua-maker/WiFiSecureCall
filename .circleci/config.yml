version: 2.1

jobs:
  mediadevice-probe-compile:
    macos:
      xcode: 27.0.0
    resource_class: m4pro.medium
    steps:
      - checkout
      - run:
          name: Install XcodeGen
          command: |
            set -euo pipefail
            brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - run:
          name: Generate isolated probe project
          command: |
            set -euo pipefail
            cd MediaDeviceProbe
            xcodegen generate
      - run:
          name: Build isolated MediaDevice probe without signing
          command: |
            set -euo pipefail
            cd MediaDeviceProbe
            xcodebuild               -project WiFiSecureCallMediaDeviceProbe.xcodeproj               -scheme MediaDeviceProbe               -configuration Release               -sdk iphoneos               -destination 'generic/platform=iOS'               CODE_SIGNING_ALLOWED=NO               CODE_SIGNING_REQUIRED=NO               build

workflows:
  mediadevice-probe-compile:
    jobs:
      - mediadevice-probe-compile
