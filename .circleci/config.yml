version: 2.1

jobs:
  mediadevice-signing-preflight:
    macos:
      xcode: 27.0.0
    resource_class: m4pro.medium
    steps:
      - checkout
      - run:
          name: Install XcodeGen
          command: |
            set -euo pipefail
            brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - run:
          name: Generate isolated probe project
          command: |
            set -euo pipefail
            cd MediaDeviceProbe
            xcodegen generate
      - run:
          name: Inspect available signing identities
          command: |
            set -euo pipefail
            security find-identity -v -p codesigning || true
            ls -la "$HOME/Library/MobileDevice/Provisioning Profiles" 2>/dev/null || true
      - run:
          name: Attempt automatic signed archive
          command: |
            set -euo pipefail
            cd MediaDeviceProbe
            xcodebuild               -project WiFiSecureCallMediaDeviceProbe.xcodeproj               -scheme MediaDeviceProbe               -configuration Release               -destination 'generic/platform=iOS'               -archivePath /tmp/WiFiSecureCallMediaDeviceProbe.xcarchive               DEVELOPMENT_TEAM=9V5XXDXF3N               CODE_SIGN_STYLE=Automatic               -allowProvisioningUpdates               archive

workflows:
  mediadevice-signing-preflight:
    jobs:
      - mediadevice-signing-preflight
