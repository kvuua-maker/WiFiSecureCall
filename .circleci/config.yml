version: 2.1

jobs:
  sdk27-carrier-calling-inspection:
    macos:
      xcode: 27.0.0
    resource_class: m4pro.medium
    steps:
      - checkout
      - run:
          name: Record SDK versions
          command: |
            set -euo pipefail
            OUT=/tmp/sdk27-carrier-calling
            mkdir -p "$OUT"
            xcodebuild -version > "$OUT/versions.txt"
            echo "IOS_SDK=$(xcrun --sdk iphoneos --show-sdk-version)" >> "$OUT/versions.txt"
            echo "WATCHOS_SDK=$(xcrun --sdk watchos --show-sdk-version)" >> "$OUT/versions.txt"
            cat "$OUT/versions.txt"
      - run:
          name: Scan public framework interfaces
          command: |
            set -euo pipefail
            OUT=/tmp/sdk27-carrier-calling/public-interface-report.txt
            : > "$OUT"
            TERMS="Wi[ -]?Fi.?Calling|VoWiFi|iCloud.?Calling|Thumper|IMS|TelephonyConversation|CellularService|CellularPlan|subscriber|carrier|radioAccess|active.?line|service.?state|companion|other.?device|conversation|telephony|dial|join|transfer|handoff|routing|provision|entitlement"
            for PLATFORM in iphoneos watchos; do
              SDK="$(xcrun --sdk "$PLATFORM" --show-sdk-path)"
              echo "=== $PLATFORM SDK=$(xcrun --sdk "$PLATFORM" --show-sdk-version) ===" >> "$OUT"
              for FW in CoreTelephony LiveCommunicationKit CallKit Network NetworkExtension WatchConnectivity AVFAudio; do
                ROOT="$SDK/System/Library/Frameworks/$FW.framework"
                if [ -d "$ROOT" ]; then
                  echo "===== $FW PRESENT =====" >> "$OUT"
                  find "$ROOT/Headers" "$ROOT/Modules" -type f 2>/dev/null | sort | while read -r FILE; do
                    grep -HnEi "$TERMS" "$FILE" 2>/dev/null || true
                  done >> "$OUT"
                else
                  echo "===== $FW ABSENT =====" >> "$OUT"
                fi
              done
            done
      - run:
          name: Enumerate public telephony declarations
          command: |
            set -euo pipefail
            OUT=/tmp/sdk27-carrier-calling/public-telephony-declarations.txt
            : > "$OUT"
            for PLATFORM in iphoneos watchos; do
              SDK="$(xcrun --sdk "$PLATFORM" --show-sdk-path)"
              echo "=== $PLATFORM ===" >> "$OUT"
              for FW in CoreTelephony LiveCommunicationKit; do
                ROOT="$SDK/System/Library/Frameworks/$FW.framework"
                [ -d "$ROOT" ] || continue
                find "$ROOT/Headers" "$ROOT/Modules" -type f 2>/dev/null | sort | while read -r FILE; do
                  grep -HnE "(^|[[:space:]])(open|public)[[:space:]]+(final[[:space:]]+)?(class|struct|enum|protocol|actor|func|var|let|typealias)|^[[:space:]]*(API_AVAILABLE|NS_CLASS_AVAILABLE|@interface|@protocol|typedef|FOUNDATION_EXPORT)" "$FILE" 2>/dev/null || true
                done >> "$OUT"
              done
            done
      - run:
          name: Search public entitlement surface
          command: |
            set -euo pipefail
            OUT=/tmp/sdk27-carrier-calling/public-entitlement-search.txt
            : > "$OUT"
            TERMS="com\.apple\.CommCenter\.fine-grained|Wi[ -]?Fi.?Calling|VoWiFi|Thumper|IMS.*entitlement|entitlement.*IMS"
            for PLATFORM in iphoneos watchos; do
              SDK="$(xcrun --sdk "$PLATFORM" --show-sdk-path)"
              echo "=== $PLATFORM ===" >> "$OUT"
              find "$SDK/System/Library/Frameworks" -type f \( -name "*.h" -o -name "*.swiftinterface" -o -name "*.modulemap" \) 2>/dev/null | sort | while read -r FILE; do
                grep -HnEi "$TERMS" "$FILE" 2>/dev/null || true
              done >> "$OUT"
            done
            shasum -a 256 /tmp/sdk27-carrier-calling/*.txt > /tmp/sdk27-carrier-calling/SHA256SUMS
      - store_artifacts:
          path: /tmp/sdk27-carrier-calling
          destination: sdk27-carrier-calling

workflows:
  sdk27-carrier-calling-inspection:
    jobs:
      - sdk27-carrier-calling-inspection
