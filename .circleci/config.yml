version: 2.1

jobs:
  sdk27-carrier-probe-validation:
    macos:
      xcode: 27.0.0
    resource_class: m4pro.medium
    steps:
      - checkout
      - run:
          name: Verify authoritative SDK 27 environment
          command: |
            set -euo pipefail
            OUT=/tmp/carrier-probe-validation
            mkdir -p "$OUT"
            xcodebuild -version > "$OUT/versions.txt"
            cat "$OUT/versions.txt"
            xcrun swiftc --version >> "$OUT/versions.txt"
            IOS_SDK="$(xcrun --sdk iphoneos --show-sdk-version)"
            WATCH_SDK="$(xcrun --sdk watchos --show-sdk-version)"
            echo "IOS_SDK=$IOS_SDK" | tee -a "$OUT/versions.txt"
            echo "WATCHOS_SDK=$WATCH_SDK" | tee -a "$OUT/versions.txt"
            test "$(sed -n '1p' "$OUT/versions.txt")" = "Xcode 27.0"
            test "$(sed -n '2p' "$OUT/versions.txt")" = "Build version 27A266a"
            grep -q "Apple Swift version 6.4" "$OUT/versions.txt"
            test "$IOS_SDK" = "27.0"
            test "$WATCH_SDK" = "27.0"
      - run:
          name: Verify SDK 27 cellular-service and default-role public surface
          command: |
            set -euo pipefail
            OUT=/tmp/carrier-probe-validation
            IOS_SDK_ROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
            LCK_INTERFACE="$IOS_SDK_ROOT/System/Library/Frameworks/LiveCommunicationKit.framework/Modules/LiveCommunicationKit.swiftmodule/arm64e-apple-ios.swiftinterface"
            UIAPPLICATION_HEADER="$IOS_SDK_ROOT/System/Library/Frameworks/UIKit.framework/Headers/UIApplication.h"
            REPORT="$OUT/sdk27-cellular-services-role-surface.txt"
            test -f "$LCK_INTERFACE"
            test -f "$UIAPPLICATION_HEADER"
            grep -Fq 'public static let sharedInstance: LiveCommunicationKit.TelephonyConversationManager' "$LCK_INTERFACE"
            grep -Fq 'final public var cellularServices: [LiveCommunicationKit.CellularService]' "$LCK_INTERFACE"
            grep -Fq 'public init(_ handle: LiveCommunicationKit.Handle, cellularService: LiveCommunicationKit.CellularService? = nil)' "$LCK_INTERFACE"
            grep -Fq 'UIApplicationCategoryWebBrowser = 1' "$UIAPPLICATION_HEADER"
            CATEGORY_BLOCK="$(sed -n '/typedef NS_ENUM(NSInteger, UIApplicationCategory) {/,/NS_SWIFT_NAME(UIApplication.Category);/p' "$UIAPPLICATION_HEADER")"
            test "$(printf '%s\n' "$CATEGORY_BLOCK" | grep -Ec '^[[:space:]]*UIApplicationCategory[A-Za-z]+[[:space:]]*=')" -eq 1
            if printf '%s\n' "$CATEGORY_BLOCK" | grep -Eq 'Calling|Dialer|Phone'; then
              echo UNEXPECTED_PUBLIC_CALLING_ROLE_CATEGORY >&2
              exit 1
            fi
            {
              echo 'XCODE=27.0 (27A266a)'
              echo 'IOS_SDK=27.0'
              echo 'TELEPHONY_MANAGER=sharedInstance; synchronous read-only cellularServices getter'
              echo 'CELLULAR_SERVICE=id,label'
              echo 'START_ACTION=handle plus optional cellularService'
              echo 'UIAPPLICATION_CATEGORY=webBrowser only'
              echo 'CALLING_DIALER_ROLE_CHECK=UNKNOWN_PUBLIC_API_NOT_EXPOSED'
              echo 'ASYNC_CATALOG_UPDATE_CHANNEL=NOT_DECLARED_IN_PUBLIC_MANAGER_SURFACE'
            } > "$REPORT"
      - run:
          name: iOS and watchOS public-API compile validation
          command: |
            set -euo pipefail
            OUT=/tmp/carrier-probe-validation
            BUILD_LOG="$OUT/ios-watch-build.log"
            xcodebuild \
              -project WiFiSecureCall.xcodeproj \
              -scheme WiFiSecureCall \
              -configuration Debug \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath /tmp/carrier-probe-derived-data \
              CODE_SIGNING_ALLOWED=NO \
              build | tee "$BUILD_LOG"
            grep -q "CarrierCallingDiagnosticView.swift.*target 'WiFiSecureCall'" "$BUILD_LOG"
            grep -q "WatchCarrierCallingDiagnosticView.swift.*target 'WiFiSecureCallWatch'" "$BUILD_LOG"
            grep -q "target arm64-apple-ios15.0" "$BUILD_LOG"
            grep -q "target arm64.*-apple-watchos9.2" "$BUILD_LOG"
            grep -q "\*\* BUILD SUCCEEDED \*\*" "$BUILD_LOG"
            IOS_INFO='/tmp/carrier-probe-derived-data/Build/Products/Debug-iphoneos/WiFi Secure Call.app/Info.plist'
            test -f "$IOS_INFO"
            python3 -c 'import plistlib, sys; modes = plistlib.load(open(sys.argv[1], "rb")).get("UIBackgroundModes", []); assert modes.count("remote-notification") == 1; assert set(modes) == {"audio", "remote-notification", "voip"}' "$IOS_INFO"
            python3 -c 'import plistlib, sys; entitlements = plistlib.load(open(sys.argv[1], "rb")); assert entitlements.get("aps-environment") == "production"; assert entitlements.get("com.apple.developer.calling-app") is True; assert entitlements.get("com.apple.developer.dialing-app") is True; assert entitlements.get("com.apple.developer.applesignin") == ["Default"]' iOS/WiFiSecureCall.entitlements
            RELEASE_SETTINGS="$OUT/ios-release-build-settings.txt"
            xcodebuild -project WiFiSecureCall.xcodeproj -target WiFiSecureCall -configuration Release -showBuildSettings > "$RELEASE_SETTINGS"
            grep -Eq '^[[:space:]]*CODE_SIGN_ENTITLEMENTS = iOS/WiFiSecureCall.entitlements$' "$RELEASE_SETTINGS"
            grep -Eq '^[[:space:]]*PROVISIONING_PROFILE_SPECIFIER = WiFiSecureCallAppStoreD24$' "$RELEASE_SETTINGS"
            printf 'IOS_TYPE_CHECK=PASS\nWATCHOS_TYPE_CHECK=PASS\nWATCHOS_10_6_2_COMPATIBLE=PASS\nIOS_REMOTE_NOTIFICATION_BACKGROUND_MODE=PASS\nIOS_CALLING_DIALING_ENTITLEMENTS=PASS\nSDK27_CELLULAR_SERVICES_SURFACE=PASS\nSDK27_CALLING_ROLE_CHECK=UNKNOWN_PUBLIC_API_NOT_EXPOSED\n' > "$OUT/result.txt"
      - store_artifacts:
          path: /tmp/carrier-probe-validation/versions.txt
          destination: carrier-probe-validation/versions.txt
      - store_artifacts:
          path: /tmp/carrier-probe-validation/result.txt
          destination: carrier-probe-validation/result.txt
      - store_artifacts:
          path: /tmp/carrier-probe-validation/sdk27-cellular-services-role-surface.txt
          destination: carrier-probe-validation/sdk27-cellular-services-role-surface.txt

workflows:
  sdk27-carrier-probe-validation:
    jobs:
      - sdk27-carrier-probe-validation
