version: 2.1

jobs:
  sdk27-exact-compile:
    macos:
      xcode: 27.0.0
    resource_class: m4pro.medium
    steps:
      - run:
          name: Typecheck exact iOS 27 public APIs
          command: |
            set -euo pipefail
            SDK="$(xcrun --sdk iphoneos --show-sdk-path)"

            cat > /tmp/SDK27Probe.swift <<'SWIFT'
            import AVFAudio
            import MediaDevice

            @available(iOS 27.0, *)
            func mediaDeviceProbe() {
                _ = AVAudioSession.Port.mediaDeviceExtension
                _ = MediaOutputDevice.Capabilities.realtimeAudioStreaming
            }

            @available(iOS 27.0, *)
            func mediaExtensionTypeProbe<T: MediaDeviceExtension>(_: T.Type) {}

            @available(iOS 27.0, *)
            func realtimeTypeProbe<T: RealtimeSampleHandling>(_: T.Type) {}

            func microphoneInjectionProbe() throws {
                let session = AVAudioSession.sharedInstance()
                _ = session.isMicrophoneInjectionAvailable
                _ = session.preferredMicrophoneInjectionMode
                try session.setPreferredMicrophoneInjectionMode(.spokenAudio)
            }
            SWIFT

            xcrun swiftc               -target arm64-apple-ios27.0               -sdk "$SDK"               -typecheck /tmp/SDK27Probe.swift

workflows:
  sdk27-exact-compile:
    jobs:
      - sdk27-exact-compile
