version: 2.1

jobs:
  exact-api-typecheck:
    macos:
      xcode: 27.0.0
    resource_class: m4pro.medium
    steps:
      - run:
          name: Exact iOS 27 API typecheck
          command: |
            set -euo pipefail
            SDK="$(xcrun --sdk iphoneos --show-sdk-path)"

            cat > /tmp/Probe.swift <<'SWIFT'
            import AVFAudio
            import MediaDevice
            import UniformTypeIdentifiers

            @available(iOS 27.0, *)
            func mediaDeviceSymbols() {
                _ = AVAudioSession.Port.mediaDeviceExtension
                _ = MediaOutputDevice.Capabilities.realtimeAudioStreaming
            }

            func micInjectionSymbols() throws {
                let session = AVAudioSession.sharedInstance()
                _ = session.isMicrophoneInjectionAvailable
                _ = session.preferredMicrophoneInjectionMode
                try session.setPreferredMicrophoneInjectionMode(.spokenAudio)
            }

            @available(iOS 27.0, *)
            struct TypeChecks {
                static func acceptExtension<T: MediaDeviceExtension>(_: T.Type) {}
                static func acceptRealtime<T: RealtimeSampleHandling>(_: T.Type) {}
            }
            SWIFT

            xcrun swiftc \
              -target arm64-apple-ios27.0 \
              -sdk "$SDK" \
              -typecheck /tmp/Probe.swift

workflows:
  exact-api-typecheck:
    jobs:
      - exact-api-typecheck

# run-exact-api-typecheck
