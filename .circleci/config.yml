version: 2.1

jobs:
  ua-ios27-speech-sdk-probe:
    macos:
      xcode: 27.0.0
    resource_class: m4pro.medium
    steps:
      - checkout
      - run:
          name: Probe iOS 27 Speech SDK for UniversalAssistant
          command: |
            set -euo pipefail
            OUT=/tmp/ua-ios27-speech-probe
            mkdir -p "$OUT"
            REPORT="$OUT/report.txt"
            : > "$REPORT"
            {
              echo "XCODE"
              xcodebuild -version
              echo "IOS_SDK=$(xcrun --sdk iphoneos --show-sdk-version)"
              echo "SWIFT=$(swift --version | head -1)"
            } | tee -a "$REPORT"

            SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
            cat > /tmp/UAiOS27SpeechProbe.swift <<'SWIFT'
            import Foundation
            import Speech

            #if canImport(FoundationModels)
            import FoundationModels
            #endif

            @available(iOS 27.0, *)
            func probeDictationTranscriber() async throws {
                let locale = Locale(identifier: "uk-UA")
                _ = await DictationTranscriber.supportedLocale(equivalentTo: locale)
                _ = await DictationTranscriber.supportedLocales
                _ = await DictationTranscriber.installedLocales

                let preset = DictationTranscriber.Preset.progressiveShortDictation
                let transcriber = DictationTranscriber(
                    locale: locale,
                    contentHints: preset.contentHints,
                    transcriptionOptions: preset.transcriptionOptions,
                    reportingOptions: preset.reportingOptions.union([.alternativeTranscriptions]),
                    attributeOptions: preset.attributeOptions.union([.transcriptionConfidence])
                )

                var context = AnalysisContext()
                context.contextualStrings[.general] = [
                    "Viber", "вайбер", "Telegram", "телеграм",
                    "WhatsApp", "Spotify", "Київ", "Львів", "QR", "PDF"
                ]

                let analyzer = SpeechAnalyzer(modules: [transcriber])
                try await analyzer.setContext(context)
                _ = transcriber.results
            }

            @available(iOS 27.0, *)
            func probeSpeechTranscriber() async throws {
                _ = SpeechTranscriber.isAvailable
                let locale = Locale(identifier: "uk-UA")
                _ = await SpeechTranscriber.supportedLocale(equivalentTo: locale)
                _ = await SpeechTranscriber.supportedLocales
                _ = await SpeechTranscriber.installedLocales

                if let supported = await SpeechTranscriber.supportedLocale(equivalentTo: locale) {
                    let transcriber = SpeechTranscriber(locale: supported, preset: .progressiveTranscription)
                    let analyzer = SpeechAnalyzer(modules: [transcriber])
                    _ = analyzer
                    _ = transcriber.results
                }
            }

            @available(iOS 27.0, *)
            func probeSpeechDetector() async throws {
                let transcriber = DictationTranscriber(
                    locale: Locale(identifier: "uk-UA"),
                    preset: .progressiveShortDictation
                )
                let detector = SpeechDetector()
                let analyzer = SpeechAnalyzer(modules: [detector, transcriber])
                _ = analyzer
                _ = detector.results
            }

            #if canImport(FoundationModels)
            @available(iOS 27.0, *)
            func probeFoundationModels() {
                let model = SystemLanguageModel.default
                _ = model.availability
                _ = model.supportedLanguages
                _ = model.supportsLocale(Locale(identifier: "uk-UA"))
            }
            #endif
            SWIFT

            set +e
            xcrun swiftc               -sdk "$SDK"               -target arm64-apple-ios18.0               -parse-as-library               -typecheck /tmp/UAiOS27SpeechProbe.swift               >"$OUT/swiftc.stdout.txt" 2>"$OUT/swiftc.stderr.txt"
            RC=$?
            set -e
            if [[ "$RC" -eq 0 ]]; then
              echo "SDK_PROBE_COMPILE=PASS" | tee -a "$REPORT"
            else
              echo "SDK_PROBE_COMPILE=FAIL rc=$RC" | tee -a "$REPORT"
              cat "$OUT/swiftc.stderr.txt" | tee -a "$REPORT"
            fi

            SPEECH_IFACE="$(find "$SDK/System/Library/Frameworks/Speech.framework/Modules/Speech.swiftmodule" -name '*.swiftinterface' | head -1 || true)"
            if [[ -n "$SPEECH_IFACE" ]]; then
              echo "SPEECH_INTERFACE=$SPEECH_IFACE" | tee -a "$REPORT"
              grep -n -E 'DictationTranscriber|SpeechTranscriber|SpeechAnalyzer|AnalysisContext|SpeechDetector' "$SPEECH_IFACE"                 | head -160 | tee "$OUT/speech-symbols.txt" >> "$REPORT" || true
            fi

            FM_IFACE="$(find "$SDK/System/Library/Frameworks/FoundationModels.framework/Modules/FoundationModels.swiftmodule" -name '*.swiftinterface' 2>/dev/null | head -1 || true)"
            if [[ -n "$FM_IFACE" ]]; then
              echo "FOUNDATIONMODELS_INTERFACE=$FM_IFACE" | tee -a "$REPORT"
              grep -n -E 'SystemLanguageModel|LanguageModelSession|supportsLocale|supportedLanguages' "$FM_IFACE"                 | head -160 | tee "$OUT/foundationmodels-symbols.txt" >> "$REPORT" || true
            fi

            exit "$RC"
      - store_artifacts:
          path: /tmp/ua-ios27-speech-probe
          destination: ua-ios27-speech-probe

workflows:
  ua-ios27-speech-sdk-probe:
    jobs:
      - ua-ios27-speech-sdk-probe:
          filters:
            branches:
              only:
                - experiment/ua-ios27-speech-sdk-probe
