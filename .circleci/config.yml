version: 2.1

jobs:
  sdk27-scan:
    macos:
      xcode: 27.0.0
    resource_class: m4pro.medium
    steps:
      - run:
          name: Scan iOS 27 public SDK
          command: |
            set -euo pipefail

            SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
            echo "XCODE=$(xcodebuild -version | tr '\n' ' ')"
            echo "IOS_SDK=$(xcrun --sdk iphoneos --show-sdk-version)"

            mkdir -p /tmp/sdk27probe
            OUT=/tmp/sdk27probe/results.env
            : > "$OUT"

            MDE="$SDK/System/Library/Frameworks/MediaDevice.framework"
            AVFA="$SDK/System/Library/Frameworks/AVFAudio.framework"
            LCK="$SDK/System/Library/Frameworks/LiveCommunicationKit.framework"

            if [ -d "$MDE" ]; then
              echo 'export MDE_FRAMEWORK=1' >> "$OUT"
            else
              echo 'export MDE_FRAMEWORK=0' >> "$OUT"
            fi

            if grep -R -q 'realtimeAudioStreaming' "$MDE/Modules" "$MDE/Headers" 2>/dev/null; then
              echo 'export MDE_REALTIME=1' >> "$OUT"
            else
              echo 'export MDE_REALTIME=0' >> "$OUT"
            fi

            if grep -R -q -i 'mediaDeviceExtension' "$AVFA/Modules" "$AVFA/Headers" 2>/dev/null; then
              echo 'export MDE_PORT=1' >> "$OUT"
            else
              echo 'export MDE_PORT=0' >> "$OUT"
            fi

            if grep -R -q -E 'MicrophoneInjection|microphoneInjection' "$AVFA/Modules" "$AVFA/Headers" 2>/dev/null; then
              echo 'export MIC_INJECTION=1' >> "$OUT"
            else
              echo 'export MIC_INJECTION=0' >> "$OUT"
            fi

            if grep -R -q 'LiveAssistanceExtension' "$LCK/Modules" "$LCK/Headers" 2>/dev/null; then
              echo 'export LIVE_ASSISTANCE=1' >> "$OUT"
            else
              echo 'export LIVE_ASSISTANCE=0' >> "$OUT"
            fi

            if grep -R -A 160 'TelephonyConversationManager' "$LCK/Modules" "$LCK/Headers" 2>/dev/null | grep -Eiq 'audio|media|route|stream|sampleBuffer|PCM|AVAudio'; then
              echo 'export TCM_MEDIA_ROUTE=1' >> "$OUT"
            else
              echo 'export TCM_MEDIA_ROUTE=0' >> "$OUT"
            fi

            cat "$OUT"

      - persist_to_workspace:
          root: /tmp/sdk27probe
          paths:
            - results.env

  mde-framework-present:
    docker:
      - image: cimg/base:current
    steps:
      - attach_workspace:
          at: /tmp/sdk27probe
      - run:
          command: source /tmp/sdk27probe/results.env && test "$MDE_FRAMEWORK" = 1

  mde-realtime-audio-present:
    docker:
      - image: cimg/base:current
    steps:
      - attach_workspace:
          at: /tmp/sdk27probe
      - run:
          command: source /tmp/sdk27probe/results.env && test "$MDE_REALTIME" = 1

  avaudio-mediadevice-port-present:
    docker:
      - image: cimg/base:current
    steps:
      - attach_workspace:
          at: /tmp/sdk27probe
      - run:
          command: source /tmp/sdk27probe/results.env && test "$MDE_PORT" = 1

  microphone-injection-present:
    docker:
      - image: cimg/base:current
    steps:
      - attach_workspace:
          at: /tmp/sdk27probe
      - run:
          command: source /tmp/sdk27probe/results.env && test "$MIC_INJECTION" = 1

  live-assistance-present:
    docker:
      - image: cimg/base:current
    steps:
      - attach_workspace:
          at: /tmp/sdk27probe
      - run:
          command: source /tmp/sdk27probe/results.env && test "$LIVE_ASSISTANCE" = 1

  tcm-public-media-route-symbol:
    docker:
      - image: cimg/base:current
    steps:
      - attach_workspace:
          at: /tmp/sdk27probe
      - run:
          command: source /tmp/sdk27probe/results.env && test "$TCM_MEDIA_ROUTE" = 1

workflows:
  sdk27-symbol-probe:
    jobs:
      - sdk27-scan
      - mde-framework-present:
          requires:
            - sdk27-scan
      - mde-realtime-audio-present:
          requires:
            - sdk27-scan
      - avaudio-mediadevice-port-present:
          requires:
            - sdk27-scan
      - microphone-injection-present:
          requires:
            - sdk27-scan
      - live-assistance-present:
          requires:
            - sdk27-scan
      - tcm-public-media-route-symbol:
          requires:
            - sdk27-scan
