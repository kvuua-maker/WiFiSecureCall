version: 2.1

jobs:
  signing-scan:
    macos:
      xcode: 27.0.0
    resource_class: m4pro.medium
    steps:
      - run:
          name: Inspect signing state
          command: |
            set -euo pipefail
            mkdir -p /tmp/signingprobe
            OUT=/tmp/signingprobe/results.env
            : > "$OUT"

            if security find-identity -v -p codesigning 2>/dev/null | grep -q "Apple Distribution"; then
              echo 'export DIST_IDENTITY=1' >> "$OUT"
            else
              echo 'export DIST_IDENTITY=0' >> "$OUT"
            fi

            PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
            if [ -d "$PROFILE_DIR" ] && find "$PROFILE_DIR" -type f \( -name '*.mobileprovision' -o -name '*.provisionprofile' \) | grep -q .; then
              echo 'export PROFILES_PRESENT=1' >> "$OUT"
            else
              echo 'export PROFILES_PRESENT=0' >> "$OUT"
            fi

            cat "$OUT"

      - persist_to_workspace:
          root: /tmp/signingprobe
          paths:
            - results.env

  distribution-identity-present:
    docker:
      - image: cimg/base:current
    steps:
      - attach_workspace:
          at: /tmp/signingprobe
      - run:
          command: source /tmp/signingprobe/results.env && test "$DIST_IDENTITY" = 1

  provisioning-profiles-present:
    docker:
      - image: cimg/base:current
    steps:
      - attach_workspace:
          at: /tmp/signingprobe
      - run:
          command: source /tmp/signingprobe/results.env && test "$PROFILES_PRESENT" = 1

workflows:
  signing-diagnostic:
    jobs:
      - signing-scan
      - distribution-identity-present:
          requires:
            - signing-scan
      - provisioning-profiles-present:
          requires:
            - signing-scan
