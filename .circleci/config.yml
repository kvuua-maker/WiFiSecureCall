version: 2.1

jobs:
  archive-mediadevice-probe:
    macos:
      xcode: 27.0.0
      code_signing:
        - wifisecurecall-mediadevice-probe
    resource_class: m4pro.medium
    steps:
      - install_signing_bundle
      - checkout
      - run:
          name: Generate isolated MediaDeviceProbe project
          command: |
            set -euo pipefail
            if ! command -v xcodegen >/dev/null 2>&1; then
              brew install xcodegen
            fi
            cd MediaDeviceProbe
            xcodegen generate
      - run:
          name: Archive isolated MediaDeviceProbe
          command: |
            set -euo pipefail
            archive_path=/tmp/WiFiSecureCallMediaDeviceProbe.xcarchive
            xcodebuild \
              -project MediaDeviceProbe/WiFiSecureCallMediaDeviceProbe.xcodeproj \
              -scheme MediaDeviceProbe \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath "$archive_path" \
              archive
      - run:
          name: Verify signed archive and entitlements
          command: |
            set -euo pipefail
            mkdir -p /tmp/wsc-media-artifacts
            chmod +x MediaDeviceProbe/verify_archive.sh
            MediaDeviceProbe/verify_archive.sh \
              /tmp/WiFiSecureCallMediaDeviceProbe.xcarchive \
              /tmp/wsc-media-artifacts/verification.txt
            ditto -c -k --sequesterRsrc --keepParent \
              /tmp/WiFiSecureCallMediaDeviceProbe.xcarchive \
              /tmp/wsc-media-artifacts/WiFiSecureCallMediaDeviceProbe.xcarchive.zip
      - store_artifacts:
          path: /tmp/wsc-media-artifacts
          destination: signed-mediadevice-probe

workflows:
  isolated-mediadevice-probe-signing:
    jobs:
      - archive-mediadevice-probe:
          filters:
            branches:
              only:
                - circleci-project-setup
