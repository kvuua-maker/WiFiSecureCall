name: iOS Build

# Builds the WiFiSecureCall iPhone app together with its embedded Apple Watch app and publishes the
# result as a downloadable artifact in GitHub Releases.
#
# No Apple credential is needed for that path. The bundle is therefore UNSIGNED: it proves the build, it
# is what you re-sign with your own certificate before installing it on a device, and it is not
# installable on a stock device as-is.
#
# Optional repository secrets, all optional because the default path needs none of them:
#   IOS_BEARER_TOKEN, WATCH_BEARER_TOKEN   build the Release configuration instead of Debug.
#   APPSTORE_KEY_ID, APPSTORE_ISSUER_ID, APPSTORE_PRIVATE_KEY
#                                           the App Store Connect API key, the only Apple credential the
#                                           opt-in TestFlight job needs. Signing is fully automatic:
#                                           xcodebuild creates or refreshes the Apple Distribution
#                                           certificate and both provisioning profiles with this key, so
#                                           no .p12 and no .mobileprovision have to be uploaded.
#   GH_PAT                                 optional, the built-in GITHUB_TOKEN already has release access.

on:
  workflow_dispatch:
    inputs:
      build_configuration:
        description: Build configuration for the published artifact
        type: choice
        default: auto
        options: [auto, Release, Debug]
      build_number:
        description: Override CFBundleVersion, must exceed Config/Base.xcconfig
        type: string
        default: ""
      publish_release:
        description: Attach the artifact to a GitHub Release
        type: boolean
        default: true
      upload_to_testflight:
        description: Also produce a signed build and upload it to TestFlight
        type: boolean
        default: false
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  # The event is part of the group so that a push cannot cancel a manual dispatch that is already
  # uploading to TestFlight: same ref, different intent, and a signed build is too long and too far
  # along to throw away because someone pushed to main.
  group: ios-build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    name: Compile iPhone and Apple Watch targets
    # The carrier probe compiles behind `#if compiler(>=6.4)`, so the build needs the Swift 6.4
    # toolchain from Xcode 27, which is what the xcode-27 image provides and what CircleCI uses.
    # macos-26 works for everything except the probe code.
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Report toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun swiftc --version
          echo "IOS_SDK=$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "WATCHOS_SDK=$(xcrun --sdk watchos --show-sdk-version)"

      # Two questions that are easy to confuse and are answered by different evidence. One is whether
      # this Xcode documents the authentication flags for the command line. The other is which
      # ExportOptions.plist keys it reads. The help text settles the first and, insofar as it lists
      # the plist keys, documents the second. Neither is evidence that an export succeeds: only an
      # export that runs to completion is, so this step reports and never gates on the answer.
      - name: Record what xcodebuild documents
        run: |
          set -euo pipefail
          help_file="$RUNNER_TEMP/xcodebuild-help.txt"
          xcodebuild -help > "$help_file" 2>&1 || true
          [ -s "$help_file" ] || { echo '::error::xcodebuild -help produced no output.'; exit 1; }
          echo "xcodebuild -help is $(wc -l < "$help_file" | tr -d ' ') lines, $(wc -c < "$help_file" | tr -d ' ') bytes."

          echo 'authentication flags, searched in xcodebuild -help:'
          for flag in -authenticationKeyPath -authenticationKeyID -authenticationKeyIssuerID -allowProvisioningUpdates; do
            if grep -q -e "$flag" "$help_file"; then
              echo "  documented:    $flag"
            else
              echo "  NOT documented: $flag"
            fi
          done

          # The plist keys an export can be given, checked against the help of the Xcode that will run
          # the export rather than against an assumption about which Xcode ships it.
          echo 'ExportOptions.plist keys named in xcodebuild -help:'
          for key in uploadAPIKey manageAppVersionAndBuildNumber signingStyle signingCertificate uploadSymbols teamID destination method provisioningProfiles; do
            if grep -q -e "$key" "$help_file"; then
              echo "  named:     $key"
            else
              echo "  not named: $key"
            fi
          done

          {
            echo '<details><summary>xcodebuild -help, full output</summary>'
            echo
            echo '```'
            cat "$help_file"
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      # Debug and unsigned, so nothing has to be configured. Building the iPhone scheme compiles and
      # embeds the watchOS app through the embed phase, which is what keeps the two platforms compiling
      # together on every change.
      - name: Build both targets without signing
        run: |
          set -euo pipefail
          xcodebuild \
            -project WiFiSecureCall.xcodeproj \
            -scheme WiFiSecureCall \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build | tee /tmp/compile.log
          grep -q 'target .*apple-watchos' /tmp/compile.log
          grep -q 'target arm64-apple-ios' /tmp/compile.log
          echo 'Both the iPhone and Apple Watch targets compiled.'

      # Compiling proves the code builds; it says nothing about whether it behaves. The scheme already
      # carries WiFiSecureCallTests in its TestAction with skipped="NO", so the tests only ever needed to
      # be run. They are a gate on purpose: package and testflight both depend on this job, so a failing
      # test stops the build rather than being reported next to it.
      - name: Run the unit tests
        run: |
          set -euo pipefail
          # The simulator is taken from what this image actually provides rather than from a hard coded
          # device name, which breaks whenever the image changes its device set. iOS 26 simulators can host
          # a target whose deployment setting is lower, so no upper bound is imposed.
          device="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          # Only iOS runtimes can host these tests. Taking the newest runtime of any platform picks the
          # watchOS one, because its version is not lower.
          ios = [runtime for runtime in devices if ".iOS-" in runtime]
          # Runtimes are keyed by identifier and are not ordered newest first, so compare versions.
          def version(runtime):
              tail = runtime.rsplit(".", 1)[-1]
              return [int(part) for part in tail.split("-") if part.isdigit()]
          newest = max(ios, key=version, default=None)
          if newest is None:
              raise SystemExit("no iOS simulator runtime is available")
          for candidate in devices[newest]:
              if candidate.get("isAvailable") and candidate.get("name", "").startswith("iPhone"):
                  print(candidate["name"])
                  break
          else:
              raise SystemExit("no available iPhone simulator on the newest iOS runtime " + newest)
          ')"
          echo "Running the unit tests on iPhone simulator: $device"

          xcodebuild \
            -project WiFiSecureCall.xcodeproj \
            -scheme WiFiSecureCall \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=$device" \
            -derivedDataPath DerivedDataTests \
            test | tee /tmp/unit-tests.log

          # The log is kept rather than discarded: on a failure this is the only place the assertion that
          # failed is written down.
          tests="$(grep -cE "^Test Suite .* (passed|failed)" /tmp/unit-tests.log || true)"
          echo "Test Suite lines: $tests"
          grep -qE "TEST SUCCEEDED|Executed [0-9]+ tests?, with 0 failures" /tmp/unit-tests.log \
            || { echo '::error::the unit tests did not report success.'; exit 1; }
          echo 'Unit tests passed.'

  package:
    name: Build the app bundle
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: xcode-27
    timeout-minutes: 60
    outputs:
      configuration: ${{ steps.configuration.outputs.configuration }}
      version: ${{ steps.version.outputs.marketing_version }}
      build_number: ${{ steps.version.outputs.build_number }}
      artifact: ${{ steps.package.outputs.artifact }}
      publish: ${{ steps.publish.outputs.publish }}
    steps:
      - uses: actions/checkout@v7

      - name: Report toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          echo "IOS_SDK=$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "WATCHOS_SDK=$(xcrun --sdk watchos --show-sdk-version)"

      # Release configuration is only reproducible when the bearer tokens exist, because the Release
      # build phases validate them against the built Info.plist. Without the secrets the Debug
      # configuration is built instead, so this job never needs a certificate or a token.
      - name: Choose the build configuration
        id: configuration
        env:
          REQUESTED: ${{ inputs.build_configuration }}
          IOS_TOKEN: ${{ secrets.IOS_BEARER_TOKEN }}
          WATCH_TOKEN: ${{ secrets.WATCH_BEARER_TOKEN }}
        run: |
          set -euo pipefail
          tokens_present=false
          if [ -n "${IOS_TOKEN:-}" ] && [ -n "${WATCH_TOKEN:-}" ]; then tokens_present=true; fi
          case "${REQUESTED:-auto}" in
            Release) configuration=Release ;;
            Debug) configuration=Debug ;;
            *)
              if [ "$tokens_present" = true ]; then configuration=Release; else configuration=Debug; fi
              ;;
          esac
          if [ "$configuration" = Release ] && [ "$tokens_present" != true ]; then
            echo '::error::Release was requested but IOS_BEARER_TOKEN / WATCH_BEARER_TOKEN are not configured.'
            exit 1
          fi
          echo "configuration=$configuration" >> "$GITHUB_OUTPUT"
          echo "tokens_present=$tokens_present" >> "$GITHUB_OUTPUT"
          echo "Building the $configuration configuration unsigned."

      - name: Materialize Config/Secrets.xcconfig
        if: ${{ steps.configuration.outputs.configuration == 'Release' }}
        env:
          IOS_BEARER_TOKEN: ${{ secrets.IOS_BEARER_TOKEN }}
          WATCH_BEARER_TOKEN: ${{ secrets.WATCH_BEARER_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          for token in "$IOS_BEARER_TOKEN" "$WATCH_BEARER_TOKEN"; do
            if [ "${#token}" -lt 32 ]; then
              echo '::error::The bearer tokens must each be at least 32 characters.'
              exit 1
            fi
            case "$token" in
              *[[:space:]]*) echo '::error::Bearer tokens must not contain whitespace.'; exit 1 ;;
            esac
          done
          [ "$IOS_BEARER_TOKEN" != "$WATCH_BEARER_TOKEN" ] || { echo '::error::The two bearer tokens must differ.'; exit 1; }
          printf 'IOS_BEARER_TOKEN = %s\nWATCH_BEARER_TOKEN = %s\n' "$IOS_BEARER_TOKEN" "$WATCH_BEARER_TOKEN" > Config/Secrets.xcconfig
          echo 'Config/Secrets.xcconfig written.'

      - name: Resolve the build number
        id: version
        env:
          OVERRIDE: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          current="$(awk -F' *= *' '/^CURRENT_PROJECT_VERSION/{print $2}' Config/Base.xcconfig | tr -d '[:space:]')"
          marketing="$(awk -F' *= *' '/^MARKETING_VERSION/{print $2}' Config/Base.xcconfig | tr -d '[:space:]')"
          if [ -n "${OVERRIDE:-}" ]; then build="$OVERRIDE"; else build="$(( GITHUB_RUN_NUMBER + 100 ))"; fi
          printf '%s' "$build" | grep -Eq '^[0-9]+$' || { echo "::error::the build number must be numeric, got '$build'."; exit 1; }
          if [ "$build" -le "$current" ]; then
            echo "::error::build number $build must be greater than CURRENT_PROJECT_VERSION $current."
            exit 1
          fi
          echo "build_number=$build" >> "$GITHUB_OUTPUT"
          echo "marketing_version=$marketing" >> "$GITHUB_OUTPUT"
          echo "CFBundleVersion $build, project default $current, CFBundleShortVersionString $marketing."

      - name: Build the iPhone and Apple Watch apps without signing
        env:
          CONFIGURATION: ${{ steps.configuration.outputs.configuration }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project WiFiSecureCall.xcodeproj \
            -scheme WiFiSecureCall \
            -configuration "$CONFIGURATION" \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee /tmp/package-build.log
          grep -q 'target .*apple-watchos' /tmp/package-build.log

      # An app without the embedded watch bundle is not a WiFi Secure Call build, so this check is not
      # optional.
      - name: Verify the bundle contains both apps
        env:
          CONFIGURATION: ${{ steps.configuration.outputs.configuration }}
        run: |
          set -euo pipefail
          products="DerivedData/Build/Products/$CONFIGURATION-iphoneos"
          [ -d "$products" ] || { echo "::error::missing $products."; exit 1; }
          iphone_app="$(find "$products" -maxdepth 1 -type d -name '*.app' ! -name '*Watch*' -print -quit)"
          [ -n "$iphone_app" ] || { echo '::error::no iPhone .app was produced.'; exit 1; }
          watch_app="$(find "$iphone_app/Watch" -maxdepth 1 -type d -name '*.app' -print -quit)"
          [ -n "$watch_app" ] || { echo '::error::the built app has no embedded Apple Watch app.'; exit 1; }
          echo "iPhone app: $iphone_app"
          echo "Watch app:  $watch_app"
          for plist in "$iphone_app/Info.plist" "$watch_app/Info.plist"; do
            identifier="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")"
            short="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")"
            revision="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")"
            echo "  $identifier version $short build $revision"
          done

      # A manifest that is not inside the bundle is no manifest, and the required-reason declarations
      # it carries are what App Store Connect reads. This checks the bundles the build actually
      # produced rather than the source file, because target membership is what puts it there: the
      # file exists in the repository whether or not a target copies it.
      - name: Verify both apps ship the privacy manifest
        env:
          CONFIGURATION: ${{ steps.configuration.outputs.configuration }}
        run: |
          set -euo pipefail
          products="DerivedData/Build/Products/$CONFIGURATION-iphoneos"
          iphone_app="$(find "$products" -maxdepth 1 -type d -name '*.app' ! -name '*Watch*' -print -quit)"
          [ -n "$iphone_app" ] || { echo '::error::no iPhone .app was produced.'; exit 1; }
          watch_app="$(find "$iphone_app/Watch" -maxdepth 1 -type d -name '*.app' -print -quit)"
          [ -n "$watch_app" ] || { echo '::error::the built app has no embedded Apple Watch app.'; exit 1; }

          for app in "$iphone_app" "$watch_app"; do
            [ -f "$app/PrivacyInfo.xcprivacy" ] \
              || { echo "::error::$app ships no PrivacyInfo.xcprivacy."; exit 1; }
            echo "found $app/PrivacyInfo.xcprivacy"
          done

          # An app with no icon builds, installs, and is only noticed when it looks wrong on a device. There are
          # two ways an icon reaches a bundle and the check has to accept both: a bundle can ship the
          # rendition files and name them in CFBundleIconFiles, or it can name the asset catalog set in
          # CFBundleIconName and keep the renditions inside Assets.car with no standalone file at all.
          # The watch app takes the second route, so requiring an AppIcon*.png in every bundle would fail a
          # bundle that is entirely correct.
          for app in "$iphone_app" "$watch_app"; do
            [ -f "$app/Assets.car" ] || { echo "::error::$app has no compiled asset catalog."; exit 1; }
            icon_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName' "$app/Info.plist" 2>/dev/null || true)"
            # PlistBuddy frames an array as "Array {" and "}" around one entry per line, and prints
            # "Empty array" for none, so those frame lines are dropped before the entries are used as
            # file names. Feeding the frame back in would look for a file called "Array".
            icon_files_raw="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles' "$app/Info.plist" 2>/dev/null || true)"
            icon_files="$(printf '%s\n' "$icon_files_raw" \
              | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' \
              | grep -vE '^(Array.*\{|\}|Empty array)$|^$' | tr '\n' ' ' || true)"
            [ -n "$icon_name$icon_files" ] || { echo "::error::$app declares no primary app icon."; exit 1; }
            if [ -n "$icon_name" ]; then
              LC_ALL=C grep -qa "$icon_name" "$app/Assets.car" \
                || { echo "::error::$app names icon $icon_name but Assets.car does not carry it."; exit 1; }
              echo "$app: icon '$icon_name' present in Assets.car"
            fi
            for name in $icon_files; do
              find "$app" -maxdepth 1 -name "$name*.png" | grep -q . \
                || { echo "::error::$app lists icon file $name but the bundle has no matching png."; exit 1; }
            done
            [ -n "$icon_files" ] && echo "$app: icon files in bundle: $(echo "$icon_files" | tr '\n' ' ')"
          done

          work="$(mktemp -d)"
          cat > "$work/check.py" <<'PYTHON'
          import json
          import subprocess
          import sys

          # The pairs the shipped code needs: UserDefaults for the app's own installation id and
          # generation counters, and system boot time for the media reconnect deadline. A category
          # without its reason, or a reason Apple does not define, is not a declaration.
          REQUIRED = {
              ("NSPrivacyAccessedAPICategoryUserDefaults", "CA92.1"),
              ("NSPrivacyAccessedAPICategorySystemBootTime", "35F9.1"),
          }

          for manifest in sys.argv[1:]:
              converted = subprocess.run(
                  ["plutil", "-convert", "json", "-o", "-", manifest],
                  check=True, capture_output=True, text=True,
              ).stdout
              entries = json.loads(converted).get("NSPrivacyAccessedAPITypes") or []
              declared = {
                  (entry["NSPrivacyAccessedAPIType"], reason)
                  for entry in entries
                  for reason in entry["NSPrivacyAccessedAPITypeReasons"]
              }
              missing = REQUIRED - declared
              if missing:
                  pairs = ", ".join(sorted(category + " " + reason for category, reason in missing))
                  raise SystemExit("::error::" + manifest + " does not declare " + pairs)
              print("declared " + str(len(declared)) + " required-reason pairing(s): " + manifest)
          PYTHON
          python3 "$work/check.py" "$iphone_app/PrivacyInfo.xcprivacy" "$watch_app/PrivacyInfo.xcprivacy"
          rm -rf "$work"

      - name: Package the unsigned .ipa
        id: package
        env:
          CONFIGURATION: ${{ steps.configuration.outputs.configuration }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: |
          set -euo pipefail
          products="DerivedData/Build/Products/$CONFIGURATION-iphoneos"
          iphone_app="$(find "$products" -maxdepth 1 -type d -name '*.app' ! -name '*Watch*' -print -quit)"
          artifact="WiFiSecureCall-$CONFIGURATION-$BUILD_NUMBER-unsigned.ipa"
          rm -rf payload && mkdir -p payload/Payload
          cp -R "$iphone_app" "payload/Payload/$(basename "$iphone_app")"
          rm -f "$artifact"
          (cd payload && zip -qry "../$artifact" Payload)
          rm -rf payload
          # Read the listing once: piping unzip into grep -q can fail under pipefail with SIGPIPE.
          listing="$(unzip -l "$artifact")"
          grep -qE 'Payload/[^/]+\.app/Info\.plist' <<<"$listing" \
            || { echo '::error::the .ipa has no app Info.plist.'; exit 1; }
          grep -qE 'Payload/[^/]+\.app/Watch/[^/]+\.app/Info\.plist' <<<"$listing" \
            || { echo '::error::the .ipa has no embedded Apple Watch app.'; exit 1; }
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          tail -1 <<<"$listing"
          echo "Packaged $artifact"

      - uses: actions/upload-artifact@v7
        with:
          name: WiFiSecureCall-unsigned-ipa
          path: WiFiSecureCall-*-unsigned.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Decide whether to publish a release
        id: publish
        env:
          REQUESTED: ${{ inputs.publish_release }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          publish=true
          if [ "$EVENT_NAME" = 'workflow_dispatch' ] && [ "$REQUESTED" = 'false' ]; then publish=false; fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "publish=$publish"

  publish:
    name: Attach the build to a GitHub release
    needs: package
    if: needs.package.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: WiFiSecureCall-unsigned-ipa
          path: dist

      - name: Create or update the release
        env:
          # The built-in token already has contents: write, a personal token is optional.
          GH_TOKEN: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || github.token }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.package.outputs.version }}
          BUILD_NUMBER: ${{ needs.package.outputs.build_number }}
          CONFIGURATION: ${{ needs.package.outputs.configuration }}
          ARTIFACT: ${{ needs.package.outputs.artifact }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'ci-latest' }}
        run: |
          set -euo pipefail
          notes="$(printf 'WiFi Secure Call %s build %s (%s configuration).\n\nThis bundle is **unsigned**: it contains the iPhone app and its embedded Apple Watch app, and it is the build that was verified in CI. Apple only accepts signed bundles on a device, so re-sign it with your own certificate before installing, or use the TestFlight job once App Store Connect credentials are configured.\n\nAttached: %s\n' "$VERSION" "$BUILD_NUMBER" "$CONFIGURATION" "$ARTIFACT")"
          # This job has no checkout, so the repository has to be named explicitly: gh cannot infer it
          # from a git remote that does not exist here.
          if gh release view "$RELEASE_TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            # The rolling release must describe one build. Build numbers are baked into the file name,
            # so without this every run would leave its predecessor behind and the release would grow a
            # new .ipa per push with no way to tell which one is current.
            if [ "$RELEASE_TAG" = ci-latest ]; then
              while read -r asset; do
                [ -n "$asset" ] || continue
                [ "$asset" = "$ARTIFACT" ] && continue
                gh release delete-asset "$RELEASE_TAG" "$asset" --repo "$REPOSITORY" --yes
                echo "Removed the superseded asset $asset."
              done < <(gh release view "$RELEASE_TAG" --repo "$REPOSITORY" --json assets --jq '.assets[].name')
            fi
            gh release upload "$RELEASE_TAG" "dist/$ARTIFACT" --repo "$REPOSITORY" --clobber
            echo "Attached dist/$ARTIFACT to the existing release $RELEASE_TAG."
            # The rolling release is a pointer at the current build, so its title and notes have to move
            # with the asset. A tagged release keeps the changelog it was published with instead.
            if [ "$RELEASE_TAG" = ci-latest ]; then
              gh release edit "$RELEASE_TAG" --repo "$REPOSITORY" \
                --title "WiFi Secure Call $VERSION (build $BUILD_NUMBER)" --notes "$notes"
              echo "Updated the release notes to build $BUILD_NUMBER."
            fi
          else
            gh release create "$RELEASE_TAG" "dist/$ARTIFACT" --repo "$REPOSITORY" \
              --title "WiFi Secure Call $VERSION (build $BUILD_NUMBER)" --notes "$notes"
            echo "Created release $RELEASE_TAG with dist/$ARTIFACT."
          fi

  testflight:
    name: Signed build for TestFlight
    needs: validate
    # Opt-in only, so an ordinary push never uploads a build. Automatic signing needs nothing but the
    # App Store Connect API key; no certificate and no provisioning profile are uploaded by hand.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_to_testflight }}
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      TEAM_ID: 9V5XXDXF3N
      ARCHIVE: ${{ github.workspace }}/archives/WiFiSecureCall.xcarchive
      KEY_PATH: ${{ github.workspace }}/appstoreconnect/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8
    steps:
      - uses: actions/checkout@v7

      - name: Check the App Store Connect credentials
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # A plain string rather than an array: the macOS shell is bash 3.2, where expanding an empty
          # array under `set -u` fails.
          missing=''
          [ -n "$KEY_ID" ] || missing="${missing:+$missing,}APPSTORE_KEY_ID"
          [ -n "$ISSUER_ID" ] || missing="${missing:+$missing,}APPSTORE_ISSUER_ID"
          [ -n "$PRIVATE_KEY" ] || missing="${missing:+$missing,}APPSTORE_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::TestFlight needs these repository secrets: $missing"
            exit 1
          fi
          # Shapes only, never the values. A 401 from App Store Connect does not say which of these three
          # is at fault, and a shape such as a stray space is one of the reasons it can happen, so the log
          # is the only place the pairings are visible:
          # a key id is 10 characters, an issuer id 36, and neither may carry stray whitespace from a
          # copy and paste, which is what makes them fail in a way that looks like bad credentials.
          case "$KEY_ID" in
            *[[:space:]]*) echo '::error::APPSTORE_KEY_ID contains whitespace. Re-save it without spaces or a trailing newline.'; exit 1 ;;
          esac
          case "$ISSUER_ID" in
            *[[:space:]]*) echo '::error::APPSTORE_ISSUER_ID contains whitespace. Re-save it without spaces or a trailing newline.'; exit 1 ;;
          esac
          echo "APPSTORE_KEY_ID is ${#KEY_ID} characters (an App Store Connect key id has 10)."
          echo "APPSTORE_ISSUER_ID is ${#ISSUER_ID} characters (an issuer id is a 36 character UUID)."
          [ "${#KEY_ID}" -eq 10 ] || echo '::warning::That is not a 10 character key id. Check APPSTORE_KEY_ID against the AuthKey file name.'
          # The issuer is a UUID. Checking the shape catches the common mistakes at a glance: a team id
          # pasted instead, or the value from a different key's page.
          printf '%s' "$ISSUER_ID" | grep -Eqi '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$' \
            || echo '::warning::APPSTORE_ISSUER_ID is not a UUID. Copy it from Users and Access -> Integrations -> App Store Connect API, not the Team ID.'
          echo 'App Store Connect API key found.'

      - name: Write the App Store Connect API key
        env:
          PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: bash .github/actions/asc-auth-probe/write-key.sh

      # A 401 from this check does not establish a cause and asks again only to repeat it. What can be
      # established without Apple is whether the key in the
      # secret is the key that was downloaded: this prints a fingerprint of the canonical PKCS#8 DER
      # that the owner can reproduce from their own AuthKey_<KEY_ID>.p8 with one openssl command.
      # Matching digests prove the two files hold the same key and nothing more. They do not prove that
      # the key is the one Apple has on record, which is exactly what the 401 leaves unestablished.
      - name: Fingerprint the API key
        run: |
          set -euo pipefail
          KEY_PATH_FOR_PROBE="$KEY_PATH" node --input-type=module <<'NODE'
          import { createHash, createPrivateKey, createPublicKey } from 'node:crypto';
          import { readFileSync } from 'node:fs';

          const pem = readFileSync(process.env.KEY_PATH_FOR_PROBE, 'utf8');
          const key = createPrivateKey({ key: pem, format: 'pem' });
          const hex = (bytes) => createHash('sha256').update(bytes).digest('hex');

          // Exported from the parsed key rather than re-derived from the base64 by hand. The secret can
          // arrive with escaped newlines or wrapped, and the base64 of those shapes differs even though
          // the key is identical, so a hand-decoded digest would not be comparable with anything.
          const privateDer = key.export({ type: 'pkcs8', format: 'der' });
          const publicDer = createPublicKey(key).export({ type: 'spki', format: 'der' });

          console.log(`${key.asymmetricKeyDetails?.namedCurve}, ${privateDer.length} bytes of canonical PKCS#8 DER`);
          console.log(`  sha256(private DER) = ${hex(privateDer)}`);
          console.log(`  sha256(public  DER) = ${hex(publicDer)}`);
          console.log('These are digests of key material, not the key: neither can be turned back into it.');
          console.log('To compare against the file downloaded from App Store Connect:');
          console.log('  openssl pkcs8 -topk8 -nocrypt -in AuthKey_<KEY_ID>.p8 -outform DER | openssl dgst -sha256');
          console.log('The pkcs8 step matters: `openssl pkey -outform DER` writes the SEC1 structure instead,');
          console.log('which is a different byte sequence and digests to something not comparable.');
          NODE

      # xcodebuild reports every credential problem the same way: "Communication with Apple failed: a
      # non-HTTP 200 response was received (401)", with nothing about which of the three secrets is
      # wrong. This step asks App Store Connect directly, so the run either passes here with a 200 and
      # the archive is attempted, or it stops with the one fact that decides what to re-save.
      - name: Verify the key against App Store Connect
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -euo pipefail
          umask 077
          work="$(mktemp -d)"

          # The length the key structure declares, as a shape and not as provenance. A minimal
          # prime256v1 PKCS#8 structure is 138 bytes, which is 184 base64 characters, while a key
          # downloaded from App Store Connect declares 150 because that file also carries the public key.
          # Either length is expected; a length that is neither is worth seeing in the log. Neither
          # length establishes where the key came from, and neither is evidence of a cause for a 401.
          declared_bytes="$(openssl asn1parse -in "$KEY_PATH" -inform PEM 2>/dev/null \
            | head -1 | grep -oE 'hl= *[0-9]+|(^| )l= *[0-9]+' | grep -oE '[0-9]+' \
            | awk '{ total += $1 } END { print total }')"
          echo "The key structure declares ${declared_bytes:-unknown} DER bytes."

          # ES256, which is what App Store Connect issues and what the requests it signs require. The
          # signature openssl produces is DER encoded, and ES256 expects the bare r and s values, so the
          # conversion happens here rather than being left to whichever reader sees the JWT.
          cat > "$work/jwt.py" <<'PYTHON'
          import base64
          import json
          import os
          import subprocess
          import sys
          import time

          key_path, key_id, issuer_id = sys.argv[1], sys.argv[2], sys.argv[3]
          work = os.environ["JWT_WORK"]

          def b64url(raw):
              return base64.urlsafe_b64encode(raw).decode().rstrip("=")

          compact = lambda value: json.dumps(value, separators=(",", ":"))
          header = b64url(compact({"alg": "ES256", "kid": key_id, "typ": "JWT"}).encode())
          issued = int(time.time())
          payload = b64url(compact({
              "iss": issuer_id,
              "iat": issued,
              "exp": issued + 1200,
              "aud": "appstoreconnect-v1",
          }).encode())
          signing_input = f"{header}.{payload}"

          with open(f"{work}/signing_input", "wb") as fh:
              fh.write(signing_input.encode())
          subprocess.run(
              ["openssl", "dgst", "-sha256", "-sign", key_path, "-out", f"{work}/der", f"{work}/signing_input"],
              check=True,
          )

          der = open(f"{work}/der", "rb").read()

          # SEQUENCE { INTEGER r, INTEGER s }. Each integer is 32 bytes, plus a leading zero byte when
          # the top bit is set, so every one is padded or cut back down to 32 before they are joined.
          def to_raw(der):
              index = 2 if der[1] < 0x80 else 2 + (der[1] & 0x7F)
              if der[0] != 0x30:
                  raise SystemExit("the signature is not a DER SEQUENCE")
              parts = []
              for _ in range(2):
                  if der[index] != 0x02:
                      raise SystemExit("the signature does not hold two INTEGERs")
                  length = der[index + 1]
                  parts.append(der[index + 2:index + 2 + length].rjust(32, b"\x00")[-32:])
                  index += 2 + length
              return b"".join(parts)

          sys.stdout.write(signing_input + "." + b64url(to_raw(der)))
          PYTHON

          token="$(JWT_WORK="$work" python3 "$work/jwt.py" "$KEY_PATH" "$KEY_ID" "$ISSUER_ID")"
          rm -rf "$work"

          status="$(curl --silent --show-error --max-time 30 --output "$RUNNER_TEMP/asc.json" --write-out '%{http_code}' \
            --header "Authorization: Bearer $token" \
            'https://api.appstoreconnect.apple.com/v1/apps?limit=1')"
          echo "App Store Connect answered the signed request with HTTP $status."

          # Apple states the reason in the body, in words. Losing it here would mean losing the only
          # sentence that names the problem, because xcodebuild prints none of this.
          python3 - "$RUNNER_TEMP/asc.json" <<'PYTHON'
          import json
          import sys

          try:
              with open(sys.argv[1]) as fh:
                  errors = json.load(fh).get("errors", [])
          except Exception:
              raise SystemExit(0)
          for error in errors:
              code = error.get("code", "?")
              title = error.get("title", "")
              detail = error.get("detail", "")
              print(f"App Store Connect said [{code}]: {title}")
              if detail:
                  print(f"  {detail}")
          PYTHON

          # Each branch says only what that status proves. A 200 settles the signature and nothing
          # beyond it, and a 401 does not name the secret at fault, so neither is allowed to imply a
          # cause the run has not established.
          case "$status" in
            200|201)
              echo 'The signature is accepted for /v1/apps. That settles authentication only: whether the key can'
              echo 'drive automatic signing, and whether the profiles exist, are not confirmed by this request.'
              ;;
            401)
              echo '::error::App Store Connect rejected the signed request.'
              echo '::error::This does not establish a cause and does not name which secret is at fault, if any.'
              echo '::error::at fault: the issuer may be another team, the key may have been revoked, or the key id may'
              echo '::error::not belong to the uploaded .p8. Check whether AuthKey_<KEY_ID>.p8 and APPSTORE_KEY_ID share a'
              echo '::error::key id, and whether APPSTORE_ISSUER_ID is the issuer listed on that same key.'
              echo '::error::Apple serves the .p8 for a download only once. If the file is lost, create a new key and'
              echo '::error::replace all three secrets together; there is nothing to re-download.'
              exit 1
              ;;
            403)
              echo '::error::The request was refused, so this says nothing about the signature. Refusal here is usually'
              echo '::error::a role or app scope matter: check the key role in Users and Access, and whether this team'
              echo '::error::can see the apps being listed.'
              exit 1
              ;;
            *)
              echo '::error::App Store Connect answered HTTP '"$status"', which settles nothing about the credentials.'
              exit 1
              ;;
          esac

      - name: Materialize Config/Secrets.xcconfig
        env:
          IOS_BEARER_TOKEN: ${{ secrets.IOS_BEARER_TOKEN }}
          WATCH_BEARER_TOKEN: ${{ secrets.WATCH_BEARER_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          if [ -z "$IOS_BEARER_TOKEN" ] || [ -z "$WATCH_BEARER_TOKEN" ]; then
            # These are not build settings the project can supply for itself. They are generated per
            # deployment and shared with the backend out of band, which is why Config/Secrets.xcconfig
            # is ignored by Git and why no copy of them exists anywhere in the tree or its history.
            echo '::error::A Release build needs IOS_BEARER_TOKEN and WATCH_BEARER_TOKEN as repository secrets.'
            echo '::error::They are not in this repository on purpose: Config/Secrets.xcconfig is gitignored (see README, "Local configuration").'
            echo '::error::Set both from the same Config/Secrets.xcconfig used when the backend was deployed, so the app and the server accept each other.'
            exit 1
          fi
          for token in "$IOS_BEARER_TOKEN" "$WATCH_BEARER_TOKEN"; do
            if [ "${#token}" -lt 32 ]; then
              echo '::error::The bearer tokens must each be at least 32 characters.'
              exit 1
            fi
            case "$token" in
              *[[:space:]]*) echo '::error::Bearer tokens must not contain whitespace.'; exit 1 ;;
            esac
          done
          printf 'IOS_BEARER_TOKEN = %s\nWATCH_BEARER_TOKEN = %s\n' "$IOS_BEARER_TOKEN" "$WATCH_BEARER_TOKEN" > Config/Secrets.xcconfig
          echo 'Config/Secrets.xcconfig written.'

      # Read-only, and placed before the archive because the export is the step that has to create
      # profiles, and a profile can only carry capabilities the App ID already has. What the team holds
      # is cheaper to read here than to infer from an export that failed. Nothing is created or changed.
      - name: Report the App IDs the team already holds
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -euo pipefail
          # The job already holds the key location and the two identifiers under its own names, which
          # are the ones every other step here uses. The helper takes them as APPSTORE_*, so they are
          # mapped at the call rather than renamed everywhere.
          get() {
            APPSTORE_KEY_PATH="$KEY_PATH" APPSTORE_KEY_ID="$KEY_ID" APPSTORE_ISSUER_ID="$ISSUER_ID" \
              node .github/actions/asc-auth-probe/asc-get.mjs "$1" "$2"
          }

          status="$(get '/v1/bundleIds?limit=200' "$RUNNER_TEMP/bundleIds.json")"
          echo "GET /v1/bundleIds -> $status"
          if [ "$status" != 'HTTP 200' ]; then
            echo '::warning::the App ID list is not readable with this key, so the export will be the first thing to try.'
            exit 0
          fi
          python3 - "$RUNNER_TEMP/bundleIds.json" <<'PYTHON'
          import json
          import sys

          with open(sys.argv[1]) as fh:
              body = json.load(fh)
          wanted = {"com.vkapps.wifisecurecall", "com.vkapps.wifisecurecall.watchkitapp"}
          seen = set()
          for entry in body.get("data", []):
              attributes = entry.get("attributes", {})
              identifier = attributes.get("identifier")
              seen.add(identifier)
              print(f"  registered: {identifier} ({attributes.get('platform')}) id={entry.get('id')}")
          for identifier in sorted(wanted - seen):
              print(f"  MISSING: {identifier} is not registered in this team")
          PYTHON

      # Signing is taken off the archive on purpose, and left entirely to the export below.
      #
      # Two runs said why. With CODE_SIGN_STYLE=Automatic and no identity, run 37197963432 had Xcode ask
      # for "iOS App Development" provisioning profiles for both bundle ids and then report that the team
      # has no devices from which to generate one. Naming Apple Distribution did not help: run 37199505152
      # refused with "automatically signed for development, but a conflicting code signing identity Apple
      # Distribution has been manually specified". So this project resolves to automatic signing for
      # development, and a development profile cannot exist for a team with no registered devices.
      #
      # The archive therefore carries no signature, which costs nothing: -exportArchive signs the bundles on
      # the way out, with signingStyle=automatic, method=app-store-connect, -allowProvisioningUpdates and the
      # same App Store Connect key. An Admin key may create the Apple Distribution certificate and the App
      # Store profiles, and App Store profiles need no device list. The archive step keeps the
      # authentication flags off entirely, since it has nothing to authenticate.
      - name: Archive without signing
        id: archive
        env:
          OVERRIDE: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          mkdir -p archives

          # The same rule the package job applies, so the archive carries the same CFBundleVersion as
          # the unsigned bundle this run verified. Computing it from the run number alone ignored an
          # override, which let the two disagree, and skipped the check that the number is one App
          # Store Connect will accept: it rejects a build whose CFBundleVersion it has already seen.
          current="$(awk -F' *= *' '/^CURRENT_PROJECT_VERSION/{print $2}' Config/Base.xcconfig | tr -d '[:space:]')"
          if [ -n "${OVERRIDE:-}" ]; then build="$OVERRIDE"; else build="$(( GITHUB_RUN_NUMBER + 100 ))"; fi
          printf '%s' "$build" | grep -Eq '^[0-9]+$' || { echo "::error::the build number must be numeric, got '$build'."; exit 1; }
          if [ "$build" -le "$current" ]; then
            echo "::error::build number $build must be greater than CURRENT_PROJECT_VERSION $current."
            exit 1
          fi
          echo "Archiving with CFBundleVersion $build, against a project default of $current."
          echo "build_number=$build" >> "$GITHUB_OUTPUT"

          xcodebuild \
            -project WiFiSecureCall.xcodeproj \
            -scheme WiFiSecureCall \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE" \
            -derivedDataPath DerivedData \
            CURRENT_PROJECT_VERSION="$build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive | tee /tmp/archive.log

      # The archive is unsigned now, so it is checked for what it must contain rather than for a
      # signature. Whether the export signs both bundles is reported by the export step and then checked
      # against App Store Connect, not assumed here.
      - name: Verify the archive holds both apps
        run: |
          set -euo pipefail
          iphone_app="$(find "$ARCHIVE/Products/Applications" -maxdepth 1 -name '*.app' -print -quit)"
          [ -n "$iphone_app" ] || { echo '::error::no iPhone .app inside the archive.'; exit 1; }
          watch_app="$(find "$iphone_app/Watch" -maxdepth 1 -name '*.app' -print -quit)"
          [ -n "$watch_app" ] || { echo '::error::the archive has no embedded Apple Watch app.'; exit 1; }
          for app in "$iphone_app" "$watch_app"; do
            identifier="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")"
            revision="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist")"
            echo "archived: $identifier build $revision"
          done
          echo "No signature is expected at this point; the export signs both bundles."

      # The export needs the same App Store Connect credentials the archive used, and it takes them
      # the way xcodebuild documents for -exportArchive: as authentication flags on the command line,
      # the same flags the archive step above already uses. The credentials used to sit in an
      # uploadAPIKey dictionary inside ExportOptions.plist. Xcode 27.0 does enumerate the
      # ExportOptions.plist keys it recognises in xcodebuild -help, and uploadAPIKey is absent from that
      # list while manageAppVersionAndBuildNumber, signingStyle, signingCertificate, uploadSymbols,
      # teamID, destination, method and provisioningProfiles are all named. So that field rested on an
      # assumption rather than on documentation, and a field Xcode does not read fails at upload time,
      # long after the archive, which is exactly where this job needs no new unknown. Being documented
      # is not evidence that an export succeeds: only an export that runs to completion is, and no run
      # has reached this step.
      - name: Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -euo pipefail
          # Recorded, not enforced: this is the evidence that the flags below exist on this runner's
          # Xcode, and the log keeps it for the next run without turning a help-text difference into a
          # failure of the upload itself.
          xcodebuild -help 2>&1 \
            | grep -oE -- '-authenticationKey(Path|ID|IssuerID)|-allowProvisioningUpdates' \
            | sort -u | sed 's/^/xcodebuild -help documents: /' \
            || echo '::warning::xcodebuild -help listed none of the authentication flags; the export below relies on the archive step using the same ones.'

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key>
            <string>upload</string>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST
          # Well-formedness only. The credentials are not in this file, so there is nothing here for
          # this check to confirm about authentication.
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"

          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            -allowProvisioningUpdates \
            | tee /tmp/testflight-upload.log

          # Xcode 27.0 words a successful export "** EXPORT SUCCEEDED **", on the line after
          # "Uploaded <name>". Earlier releases printed "Upload succeeded", and altool printed
          # "UPLOAD SUCCEEDED". Run 37201153081 delivered the binary and then failed only this
          # check, because none of the older phrasings appeared in its log.
          grep -qE 'EXPORT SUCCEEDED|Upload succeeded|Delivered your binary|UPLOAD SUCCEEDED' /tmp/testflight-upload.log \
            || { echo '::error::the export did not report success.'; exit 1; }
          echo 'The export reported success.'

      # Sign in with Apple on the watch was reported as not working at all, and the source
      # .entitlements file cannot answer whether that is why: it says what was asked for, not what was
      # granted. What decides it is the entitlement set the exported bundle actually carries, and the
      # entitlements the profile that signed it actually allows. So both are read back here, from the
      # signed artefacts, and the watch's own bundle is asked rather than the phone's, because the watch
      # has its own App ID and its own profile and can be granted the capability without the phone.
      - name: Read the entitlements the export actually granted
        run: |
          set -euo pipefail
          export_root="$RUNNER_TEMP/export"
          iphone_app="$(find "$export_root/Payload" -maxdepth 1 -type d -name '*.app' ! -name '*Watch*' -print -quit)"
          [ -n "$iphone_app" ] || { echo '::error::the export produced no iPhone .app to read.'; exit 1; }
          watch_app="$(find "$iphone_app/Watch" -maxdepth 1 -type d -name '*.app' -print -quit)"
          [ -n "$watch_app" ] || { echo '::error::the export has no embedded Apple Watch app.'; exit 1; }

          report() {
            local label="$1" app="$2" required="$3"
            local signed profile
            signed="$(codesign -d --entitlements - --xml "$app" 2>/dev/null || true)"
            [ -n "$signed" ] || { echo "::error::$label has no readable signature entitlements."; exit 1; }
            echo "$signed" > "$RUNNER_TEMP/entitlements-$label.plist"

            profile="$(find "$app" -name embedded.mobileprovision -print -quit)"
            if [ -n "$profile" ]; then
              security cms -D -i "$profile" > "$RUNNER_TEMP/profile-$label.plist" 2>/dev/null \
                || echo "::warning::$label profile could not be decoded; only the signed entitlements will be read."
            fi

            echo "== $label: $app"
            echo "-- signed entitlements"
            /usr/libexec/PlistBuddy -c Print "$RUNNER_TEMP/entitlements-$label.plist" 2>/dev/null \
              || echo '   (none beyond the code signature)'
            if [ -n "$profile" ] && [ -f "$RUNNER_TEMP/profile-$label.plist" ]; then
              echo "-- entitlements the profile allows"
              /usr/libexec/PlistBuddy -c 'Print :Entitlements' "$RUNNER_TEMP/profile-$label.plist" 2>/dev/null \
                || echo '   (profile carries no entitlement list)'
            else
              echo "-- no embedded profile (App Store distribution); the signed entitlements above are what runs"
            fi

            /usr/libexec/PlistBuddy -c "Print :$required" "$RUNNER_TEMP/entitlements-$label.plist" >/dev/null 2>&1 \
              || { echo "::error::$label is missing $required in the signed bundle, which is why the capability cannot run."; exit 1; }
            echo "$label carries $required in the signed bundle."
          }

          report iphone "$iphone_app" com.apple.developer.applesignin
          report watch "$watch_app" com.apple.developer.applesignin

          echo 'The Sign in with Apple entitlement is present in both signed bundles.'

      # A delivered binary is not yet a build. This asks App Store Connect for the record it created,
      # by the version and build number the archive carried, and prints the state Apple puts on it. Only
      # that record distinguishes an upload that was processed from one that was rejected after transfer.
      - name: Confirm the build in App Store Connect
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          BUILD: ${{ steps.archive.outputs.build_number }}
          VERSION: 0.1.0
        run: |
          set -euo pipefail
          get() {
            APPSTORE_KEY_PATH="$KEY_PATH" APPSTORE_KEY_ID="$KEY_ID" APPSTORE_ISSUER_ID="$ISSUER_ID" \
              node .github/actions/asc-auth-probe/asc-get.mjs "$1" "$2"
          }

          # Apple's own words. A status on its own says which request failed, not why, and the reason is the
          # only sentence that names the mistake.
          describe() {
            python3 - "$1" <<'PYTHON'
          import json
          import sys

          try:
              with open(sys.argv[1]) as fh:
                  body = json.load(fh)
          except Exception:
              print("  the body was not the JSON envelope App Store Connect sends")
              raise SystemExit(0)
          errors = body.get("errors", [])
          if not errors:
              print("  no error text in the body")
          for error in errors:
              print(f"  [{error.get('code', '?')}] {error.get('title', '')}")
              if error.get("detail"):
                  print(f"    {error['detail']}")
          PYTHON
          }

          apps="$(get '/v1/apps?limit=200' "$RUNNER_TEMP/asc-apps.json")"
          echo "GET /v1/apps -> $apps"
          if [ "$apps" != 'HTTP 200' ]; then
            echo '::error::the app list could not be read.'
            describe "$RUNNER_TEMP/asc-apps.json"
            exit 1
          fi
          app_id="$(python3 - "$RUNNER_TEMP/asc-apps.json" <<'PYTHON'
          import json
          import sys

          with open(sys.argv[1]) as fh:
              body = json.load(fh)
          for entry in body.get("data", []):
              if entry.get("attributes", {}).get("bundleId") == "com.vkapps.wifisecurecall":
                  print(entry["id"])
                  break
          PYTHON
          )"
          [ -n "$app_id" ] || { echo '::error::no App Store Connect app record for com.vkapps.wifisecurecall was found.'; exit 1; }
          echo "app record: $app_id"

          versions="$(get "/v1/preReleaseVersions?filter[app]=$app_id&filter[platform]=IOS&limit=50" "$RUNNER_TEMP/asc-versions.json")"
          echo "GET /v1/preReleaseVersions -> $versions"
          if [ "$versions" != 'HTTP 200' ]; then
            describe "$RUNNER_TEMP/asc-versions.json"
          fi
          version_id="$(python3 - "$RUNNER_TEMP/asc-versions.json" "$VERSION" <<'PYTHON'
          import json
          import sys

          try:
              with open(sys.argv[1]) as fh:
                  body = json.load(fh)
          except Exception:
              raise SystemExit(0)
          for entry in body.get("data", []):
              if entry.get("attributes", {}).get("versionString") == sys.argv[2]:
                  print(entry["id"])
                  break
          PYTHON
          )"
          if [ -n "$version_id" ]; then
            echo "preReleaseVersion $VERSION: $version_id"
          else
            echo "No preReleaseVersion $VERSION is listed for this app."
          fi

          if [ -n "$version_id" ]; then
            path="/v1/builds?filter[preReleaseVersion]=$version_id&limit=50"
          else
            path="/v1/builds?filter[app]=$app_id&limit=50"
          fi
          builds="$(get "$path" "$RUNNER_TEMP/asc-builds.json")"
          echo "GET $path -> $builds"
          if [ "$builds" != 'HTTP 200' ]; then
            describe "$RUNNER_TEMP/asc-builds.json"
            echo '::error::the build list could not be read, so the upload cannot be confirmed.'
            exit 1
          fi

          python3 - "$RUNNER_TEMP/asc-builds.json" "$VERSION" "$BUILD" <<'PYTHON'
          import json
          import sys

          with open(sys.argv[1]) as fh:
              body = json.load(fh)
          version, build = sys.argv[2], sys.argv[3]

          versions = {i.get("id"): i.get("attributes", {}).get("versionString")
                      for i in body.get("included", []) if i.get("type") == "preReleaseVersions"}
          entries = body.get("data", [])

          # Every build of this app is listed, not only the one this run sent, so the record left by an
          # earlier run is visible too. A number is spent once Apple accepts it, so the builds already
          # here are the ones that were really delivered.
          if not entries:
              print(f"No builds are listed for this app. Version {version} build {build} was not recorded.")
              raise SystemExit(0)

          for entry in sorted(entries, key=lambda e: e.get("attributes", {}).get("version", "")):
              attributes = entry.get("attributes", {})
              number = attributes.get("version")
              state = attributes.get("processingState")
              marker = " <- this run" if number == build else ""
              print(f"build {number} of {version}: {state}{marker}")
              for field in ("uploadedDate", "expiringDate", "usesNonExemptEncryption"):
                  if attributes.get(field) is not None:
                      print(f"    {field}: {attributes[field]}")
              print(f"    preReleaseVersion: {versions.get(entry.get('relationships', {}).get('preReleaseVersion', {}).get('data', {}).get('id'))}")

          if not any(e.get("attributes", {}).get("version") == build for e in entries):
              print(f"This run sent build {build}, which is not listed. See the export log for what Apple answered.")
          PYTHON

      - name: Remove the API key from the workspace
        if: always()
        run: |
          rm -rf appstoreconnect "$RUNNER_TEMP/appstoreconnect" "$RUNNER_TEMP/export"
          echo 'Removed the local copy of the API key.'

  summary:
    name: Summary
    needs: [validate, package, publish, testflight]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -euo pipefail
          validate='${{ needs.validate.result }}'
          package='${{ needs.package.result }}'
          testflight='${{ needs.testflight.result }}'
          configuration='${{ needs.package.outputs.configuration }}'
          version='${{ needs.package.outputs.version }}'
          build='${{ needs.package.outputs.build_number }}'
          artifact='${{ needs.package.outputs.artifact }}'
          {
            echo '### WiFi Secure Call build'
            echo
            echo "- Compile check: $validate"
            echo "- Bundle: $package"
            if [ "$package" = success ]; then
              echo "- Artifact: \`$artifact\` ($configuration configuration, unsigned)"
              if [ -n "$version" ]; then
                echo "- Version: $version, build $build"
              fi
              echo '- Install note: unsigned, re-sign with your own certificate before putting it on a device.'
            fi
            if [ "$testflight" != skipped ]; then
              echo "- TestFlight: $testflight"
            fi
          } >> "$GITHUB_STEP_SUMMARY"