name: iOS Build

# Builds the WiFiSecureCall iPhone app together with its embedded Apple Watch app and publishes the
# result as a downloadable artifact in GitHub Releases.
#
# No Apple credential is needed for that path. The bundle is therefore UNSIGNED: it proves the build, it
# is what you re-sign with your own certificate before installing it on a device, and it is not
# installable on a stock device as-is.
#
# Optional repository secrets, all optional because the default path needs none of them:
#   IOS_BEARER_TOKEN, WATCH_BEARER_TOKEN   build the Release configuration instead of Debug.
#   APPSTORE_KEY_ID, APPSTORE_ISSUER_ID, APPSTORE_PRIVATE_KEY
#                                           the App Store Connect API key, the only Apple credential the
#                                           opt-in TestFlight job needs. Signing is fully automatic:
#                                           xcodebuild creates or refreshes the Apple Distribution
#                                           certificate and both provisioning profiles with this key, so
#                                           no .p12 and no .mobileprovision have to be uploaded.
#   GH_PAT                                 optional, the built-in GITHUB_TOKEN already has release access.

on:
  workflow_dispatch:
    inputs:
      build_configuration:
        description: Build configuration for the published artifact
        type: choice
        default: auto
        options: [auto, Release, Debug]
      build_number:
        description: Override CFBundleVersion, must exceed Config/Base.xcconfig
        type: string
        default: ""
      publish_release:
        description: Attach the artifact to a GitHub Release
        type: boolean
        default: true
      upload_to_testflight:
        description: Also produce a signed build and upload it to TestFlight
        type: boolean
        default: false
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  # The event is part of the group so that a push cannot cancel a manual dispatch that is already
  # uploading to TestFlight: same ref, different intent, and a signed build is too long and too far
  # along to throw away because someone pushed to main.
  group: ios-build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    name: Compile iPhone and Apple Watch targets
    # The carrier probe compiles behind `#if compiler(>=6.4)`, so the build needs the Swift 6.4
    # toolchain from Xcode 27, which is what the xcode-27 image provides and what CircleCI uses.
    # macos-26 works for everything except the probe code.
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Report toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun swiftc --version
          echo "IOS_SDK=$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "WATCHOS_SDK=$(xcrun --sdk watchos --show-sdk-version)"

      # Debug and unsigned, so nothing has to be configured. Building the iPhone scheme compiles and
      # embeds the watchOS app through the embed phase, which is what keeps the two platforms compiling
      # together on every change.
      - name: Build both targets without signing
        run: |
          set -euo pipefail
          xcodebuild \
            -project WiFiSecureCall.xcodeproj \
            -scheme WiFiSecureCall \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build | tee /tmp/compile.log
          grep -q 'target .*apple-watchos' /tmp/compile.log
          grep -q 'target arm64-apple-ios' /tmp/compile.log
          echo 'Both the iPhone and Apple Watch targets compiled.'

  package:
    name: Build the app bundle
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: xcode-27
    timeout-minutes: 60
    outputs:
      configuration: ${{ steps.configuration.outputs.configuration }}
      version: ${{ steps.version.outputs.marketing_version }}
      build_number: ${{ steps.version.outputs.build_number }}
      artifact: ${{ steps.package.outputs.artifact }}
      publish: ${{ steps.publish.outputs.publish }}
    steps:
      - uses: actions/checkout@v7

      - name: Report toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          echo "IOS_SDK=$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "WATCHOS_SDK=$(xcrun --sdk watchos --show-sdk-version)"

      # Release configuration is only reproducible when the bearer tokens exist, because the Release
      # build phases validate them against the built Info.plist. Without the secrets the Debug
      # configuration is built instead, so this job never needs a certificate or a token.
      - name: Choose the build configuration
        id: configuration
        env:
          REQUESTED: ${{ inputs.build_configuration }}
          IOS_TOKEN: ${{ secrets.IOS_BEARER_TOKEN }}
          WATCH_TOKEN: ${{ secrets.WATCH_BEARER_TOKEN }}
        run: |
          set -euo pipefail
          tokens_present=false
          if [ -n "${IOS_TOKEN:-}" ] && [ -n "${WATCH_TOKEN:-}" ]; then tokens_present=true; fi
          case "${REQUESTED:-auto}" in
            Release) configuration=Release ;;
            Debug) configuration=Debug ;;
            *)
              if [ "$tokens_present" = true ]; then configuration=Release; else configuration=Debug; fi
              ;;
          esac
          if [ "$configuration" = Release ] && [ "$tokens_present" != true ]; then
            echo '::error::Release was requested but IOS_BEARER_TOKEN / WATCH_BEARER_TOKEN are not configured.'
            exit 1
          fi
          echo "configuration=$configuration" >> "$GITHUB_OUTPUT"
          echo "tokens_present=$tokens_present" >> "$GITHUB_OUTPUT"
          echo "Building the $configuration configuration unsigned."

      - name: Materialize Config/Secrets.xcconfig
        if: ${{ steps.configuration.outputs.configuration == 'Release' }}
        env:
          IOS_BEARER_TOKEN: ${{ secrets.IOS_BEARER_TOKEN }}
          WATCH_BEARER_TOKEN: ${{ secrets.WATCH_BEARER_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          for token in "$IOS_BEARER_TOKEN" "$WATCH_BEARER_TOKEN"; do
            if [ "${#token}" -lt 32 ]; then
              echo '::error::The bearer tokens must each be at least 32 characters.'
              exit 1
            fi
            case "$token" in
              *[[:space:]]*) echo '::error::Bearer tokens must not contain whitespace.'; exit 1 ;;
            esac
          done
          [ "$IOS_BEARER_TOKEN" != "$WATCH_BEARER_TOKEN" ] || { echo '::error::The two bearer tokens must differ.'; exit 1; }
          printf 'IOS_BEARER_TOKEN = %s\nWATCH_BEARER_TOKEN = %s\n' "$IOS_BEARER_TOKEN" "$WATCH_BEARER_TOKEN" > Config/Secrets.xcconfig
          echo 'Config/Secrets.xcconfig written.'

      - name: Resolve the build number
        id: version
        env:
          OVERRIDE: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          current="$(awk -F' *= *' '/^CURRENT_PROJECT_VERSION/{print $2}' Config/Base.xcconfig | tr -d '[:space:]')"
          marketing="$(awk -F' *= *' '/^MARKETING_VERSION/{print $2}' Config/Base.xcconfig | tr -d '[:space:]')"
          if [ -n "${OVERRIDE:-}" ]; then build="$OVERRIDE"; else build="$(( GITHUB_RUN_NUMBER + 100 ))"; fi
          printf '%s' "$build" | grep -Eq '^[0-9]+$' || { echo "::error::the build number must be numeric, got '$build'."; exit 1; }
          if [ "$build" -le "$current" ]; then
            echo "::error::build number $build must be greater than CURRENT_PROJECT_VERSION $current."
            exit 1
          fi
          echo "build_number=$build" >> "$GITHUB_OUTPUT"
          echo "marketing_version=$marketing" >> "$GITHUB_OUTPUT"
          echo "CFBundleVersion $build, project default $current, CFBundleShortVersionString $marketing."

      - name: Build the iPhone and Apple Watch apps without signing
        env:
          CONFIGURATION: ${{ steps.configuration.outputs.configuration }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project WiFiSecureCall.xcodeproj \
            -scheme WiFiSecureCall \
            -configuration "$CONFIGURATION" \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee /tmp/package-build.log
          grep -q 'target .*apple-watchos' /tmp/package-build.log

      # An app without the embedded watch bundle is not a WiFi Secure Call build, so this check is not
      # optional.
      - name: Verify the bundle contains both apps
        env:
          CONFIGURATION: ${{ steps.configuration.outputs.configuration }}
        run: |
          set -euo pipefail
          products="DerivedData/Build/Products/$CONFIGURATION-iphoneos"
          [ -d "$products" ] || { echo "::error::missing $products."; exit 1; }
          iphone_app="$(find "$products" -maxdepth 1 -type d -name '*.app' ! -name '*Watch*' -print -quit)"
          [ -n "$iphone_app" ] || { echo '::error::no iPhone .app was produced.'; exit 1; }
          watch_app="$(find "$iphone_app/Watch" -maxdepth 1 -type d -name '*.app' -print -quit)"
          [ -n "$watch_app" ] || { echo '::error::the built app has no embedded Apple Watch app.'; exit 1; }
          echo "iPhone app: $iphone_app"
          echo "Watch app:  $watch_app"
          for plist in "$iphone_app/Info.plist" "$watch_app/Info.plist"; do
            identifier="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")"
            short="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")"
            revision="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")"
            echo "  $identifier version $short build $revision"
          done

      - name: Package the unsigned .ipa
        id: package
        env:
          CONFIGURATION: ${{ steps.configuration.outputs.configuration }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: |
          set -euo pipefail
          products="DerivedData/Build/Products/$CONFIGURATION-iphoneos"
          iphone_app="$(find "$products" -maxdepth 1 -type d -name '*.app' ! -name '*Watch*' -print -quit)"
          artifact="WiFiSecureCall-$CONFIGURATION-$BUILD_NUMBER-unsigned.ipa"
          rm -rf payload && mkdir -p payload/Payload
          cp -R "$iphone_app" "payload/Payload/$(basename "$iphone_app")"
          rm -f "$artifact"
          (cd payload && zip -qry "../$artifact" Payload)
          rm -rf payload
          # Read the listing once: piping unzip into grep -q can fail under pipefail with SIGPIPE.
          listing="$(unzip -l "$artifact")"
          grep -qE 'Payload/[^/]+\.app/Info\.plist' <<<"$listing" \
            || { echo '::error::the .ipa has no app Info.plist.'; exit 1; }
          grep -qE 'Payload/[^/]+\.app/Watch/[^/]+\.app/Info\.plist' <<<"$listing" \
            || { echo '::error::the .ipa has no embedded Apple Watch app.'; exit 1; }
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          tail -1 <<<"$listing"
          echo "Packaged $artifact"

      - uses: actions/upload-artifact@v7
        with:
          name: WiFiSecureCall-unsigned-ipa
          path: WiFiSecureCall-*-unsigned.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Decide whether to publish a release
        id: publish
        env:
          REQUESTED: ${{ inputs.publish_release }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          publish=true
          if [ "$EVENT_NAME" = 'workflow_dispatch' ] && [ "$REQUESTED" = 'false' ]; then publish=false; fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "publish=$publish"

  publish:
    name: Attach the build to a GitHub release
    needs: package
    if: needs.package.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: WiFiSecureCall-unsigned-ipa
          path: dist

      - name: Create or update the release
        env:
          # The built-in token already has contents: write, a personal token is optional.
          GH_TOKEN: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || github.token }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.package.outputs.version }}
          BUILD_NUMBER: ${{ needs.package.outputs.build_number }}
          CONFIGURATION: ${{ needs.package.outputs.configuration }}
          ARTIFACT: ${{ needs.package.outputs.artifact }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'ci-latest' }}
        run: |
          set -euo pipefail
          notes="$(printf 'WiFi Secure Call %s build %s (%s configuration).\n\nThis bundle is **unsigned**: it contains the iPhone app and its embedded Apple Watch app, and it is the build that was verified in CI. Apple only accepts signed bundles on a device, so re-sign it with your own certificate before installing, or use the TestFlight job once App Store Connect credentials are configured.\n\nAttached: %s\n' "$VERSION" "$BUILD_NUMBER" "$CONFIGURATION" "$ARTIFACT")"
          # This job has no checkout, so the repository has to be named explicitly: gh cannot infer it
          # from a git remote that does not exist here.
          if gh release view "$RELEASE_TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            # The rolling release must describe one build. Build numbers are baked into the file name,
            # so without this every run would leave its predecessor behind and the release would grow a
            # new .ipa per push with no way to tell which one is current.
            if [ "$RELEASE_TAG" = ci-latest ]; then
              while read -r asset; do
                [ -n "$asset" ] || continue
                [ "$asset" = "$ARTIFACT" ] && continue
                gh release delete-asset "$RELEASE_TAG" "$asset" --repo "$REPOSITORY" --yes
                echo "Removed the superseded asset $asset."
              done < <(gh release view "$RELEASE_TAG" --repo "$REPOSITORY" --json assets --jq '.assets[].name')
            fi
            gh release upload "$RELEASE_TAG" "dist/$ARTIFACT" --repo "$REPOSITORY" --clobber
            echo "Attached dist/$ARTIFACT to the existing release $RELEASE_TAG."
            # The rolling release is a pointer at the current build, so its title and notes have to move
            # with the asset. A tagged release keeps the changelog it was published with instead.
            if [ "$RELEASE_TAG" = ci-latest ]; then
              gh release edit "$RELEASE_TAG" --repo "$REPOSITORY" \
                --title "WiFi Secure Call $VERSION (build $BUILD_NUMBER)" --notes "$notes"
              echo "Updated the release notes to build $BUILD_NUMBER."
            fi
          else
            gh release create "$RELEASE_TAG" "dist/$ARTIFACT" --repo "$REPOSITORY" \
              --title "WiFi Secure Call $VERSION (build $BUILD_NUMBER)" --notes "$notes"
            echo "Created release $RELEASE_TAG with dist/$ARTIFACT."
          fi

  testflight:
    name: Signed build for TestFlight
    needs: validate
    # Opt-in only, so an ordinary push never uploads a build. Automatic signing needs nothing but the
    # App Store Connect API key; no certificate and no provisioning profile are uploaded by hand.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_to_testflight }}
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      TEAM_ID: 9V5XXDXF3N
      ARCHIVE: ${{ github.workspace }}/archives/WiFiSecureCall.xcarchive
      KEY_PATH: ${{ github.workspace }}/appstoreconnect/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8
    steps:
      - uses: actions/checkout@v7

      - name: Check the App Store Connect credentials
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # A plain string rather than an array: the macOS shell is bash 3.2, where expanding an empty
          # array under `set -u` fails.
          missing=''
          [ -n "$KEY_ID" ] || missing="${missing:+$missing,}APPSTORE_KEY_ID"
          [ -n "$ISSUER_ID" ] || missing="${missing:+$missing,}APPSTORE_ISSUER_ID"
          [ -n "$PRIVATE_KEY" ] || missing="${missing:+$missing,}APPSTORE_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::TestFlight needs these repository secrets: $missing"
            exit 1
          fi
          echo 'App Store Connect API key found.'

      - name: Write the App Store Connect API key
        env:
          PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          # The AuthKey .p8 arrives through a repository secret, so how it was pasted is out of our control: with
          # real newlines, with escaped newlines, base64 encoded, or wrapped in whatever the copy source added.
          # Rather than trusting one guess about its shape, this step collects every plausible key body it can
          # find and asks openssl which one is a real private key. Trimming is tried too, because a paste that
          # carried extra characters into the body still contains an intact key sitting next to them.
          set -euo pipefail
          umask 077
          mkdir -p "$(dirname "$KEY_PATH")"
          work="$(mktemp -d)"

          # Escaped carriage returns are removed before escaped newlines, so a value pasted out of JSON or a
          # Windows editor does not leave a literal backslash-r whose letter would end up inside the base64.
          flat="$(printf '%s' "$PRIVATE_KEY" | sed -e 's/\\r//g' -e 's/\\n/\n/g' | LC_ALL=C tr -d '\t\r\n\357\273\277')"

          candidates="$work/candidates"
          : > "$candidates"

          # Whatever sits between the first BEGIN marker and the first END marker.
          if printf '%s' "$flat" | grep -q -- '-----BEGIN'; then
            inner="$(printf '%s' "$flat" \
              | sed -E -e 's/^.*\-{5}BEGIN[A-Z0-9 ]+\-{5}//' -e 's/\-{5}END[A-Z0-9 ]+\-{5}.*$//' \
              | LC_ALL=C tr -dc 'A-Za-z0-9+/=')"
            [ -z "$inner" ] || printf '%s\n' "$inner" >> "$candidates"
          fi

          # Every long run of base64 characters, longest first. This survives a missing marker, a duplicated one,
          # and any text pasted before or after the key.
          printf '%s' "$flat" \
            | grep -oE '[A-Za-z0-9+/=]{120,}' \
            | awk '{ print length($0) "\t" $0 }' | sort -rn | cut -f2 \
            | head -5 >> "$candidates" || true

          # The whole value as one base64 blob, which is what a deliberately encoded secret looks like.
          if printf '%s' "$flat" | openssl base64 -d -A > "$work/blob" 2>/dev/null; then
            decoded="$(LC_ALL=C tr -d '\t\r\n' < "$work/blob")"
            if printf '%s' "$decoded" | grep -q -- '-----BEGIN'; then
              inner="$(printf '%s' "$decoded" \
                | sed -E -e 's/^.*\-{5}BEGIN[A-Z0-9 ]+\-{5}//' -e 's/\-{5}END[A-Z0-9 ]+\-{5}.*$//' \
                | LC_ALL=C tr -dc 'A-Za-z0-9+/=')"
              [ -z "$inner" ] || printf '%s\n' "$inner" >> "$candidates"
            else
              printf '%s' "$decoded" | grep -oE '[A-Za-z0-9+/=]{120,}' | head -5 >> "$candidates" || true
            fi
          fi

          # A candidate body is written out as PEM and judged by openssl. Nothing else decides what the key is.
          # The locals matter: without them this function would overwrite the loop variable the caller reads its
          # candidates from, and every attempt after the first would trim an already trimmed string.
          validate() {
            local body="$1" size="${#1}"
            [ "$(( size % 4 ))" -eq 0 ] || return 1
            {
              printf '%s\n' '-----BEGIN PRIVATE KEY-----'
              printf '%s' "$body" | fold -w 64
              printf '\n%s\n' '-----END PRIVATE KEY-----'
            } > "$KEY_PATH"
            openssl pkey -in "$KEY_PATH" -noout -check >/dev/null 2>&1
          }

          match=''
          while IFS= read -r candidate; do
            [ -n "$candidate" ] || continue
            size="${#candidate}"
            # Trimming is tried in order of how much is removed, so the smallest valid body wins and the written
            # file holds the key alone rather than the key plus whatever came with it.
            for total in $(seq 0 64); do
              length="$(( size - total ))"
              [ "$length" -ge 120 ] || break
              [ "$(( length % 4 ))" -eq 0 ] || continue
              for front in $(seq 0 "$total"); do
                back="$(( total - front ))"
                if validate "${candidate:$front:$length}"; then
                  match="${candidate:$front:$length}"
                  break 2
                fi
              done
            done
          done < "$candidates"

          if [ -z "$match" ]; then
            # A passphrase protected key is a real and common mistake here: exporting from Keychain or from a
            # .p12 produces this header, and openssl would otherwise report it as an unreadable structure.
            if printf '%s' "$flat" | grep -q -- 'ENCRYPTED PRIVATE KEY'; then
              echo '::error::APPSTORE_PRIVATE_KEY is a password protected key (BEGIN ENCRYPTED PRIVATE KEY).'
              echo '::error::App Store Connect keys are not encrypted. Download AuthKey_<KEY_ID>.p8 again and store it as it is.'
              exit 1
            fi
            echo '::error::No private key could be read out of APPSTORE_PRIVATE_KEY.'
            while IFS= read -r candidate; do
              [ -n "$candidate" ] || continue
              echo "::error::The longest body found was ${#candidate} base64 characters. A prime256v1 PKCS#8 body has 184."
              break
            done < "$candidates"
            echo '::error::APPSTORE_PRIVATE_KEY must hold only the contents of the AuthKey_<KEY_ID>.p8 downloaded from App Store Connect.'
            exit 1
          fi

          # openssl stops reading once the key structure is complete and ignores whatever follows it, so a body
          # with extra characters at its end still validates. The PEM is rewritten from the length the structure
          # itself declares, which leaves the file holding the key and nothing else.
          structure="$(openssl asn1parse -in "$KEY_PATH" -inform PEM 2>/dev/null | head -1)"
          # asn1parse prints "hl=3 l= 135", so l= and its value are separate words. A space rather than \b is
          # used to tell l= from the l inside hl=, because BSD grep on the macOS runner has no word boundary.
          header_len="$(printf '%s' "$structure" | grep -oE 'hl= *[0-9]+' | grep -oE '[0-9]+' || true)"
          content_len="$(printf '%s' "$structure" | grep -oE '(^| )l= *[0-9]+' | grep -oE '[0-9]+' || true)"
          declared=$(( ${header_len:-0} + ${content_len:-0} ))
          if [ -n "$declared" ] && [ "$declared" -gt 0 ]; then
            wanted=$(( (declared + 2) / 3 * 4 ))
            if [ "$wanted" -lt "${#match}" ] && [ "$wanted" -ge 120 ]; then
              if validate "${match:0:$wanted}"; then
                match="${match:0:$wanted}"
              fi
            fi
          fi

          # App Store Connect only ever issues EC prime256v1 keys, and the requests it signs are ES256 JWTs. A key
          # of any other type is one xcodebuild would reject much later, and with a far less obvious message.
          curve="$(openssl pkey -in "$KEY_PATH" -noout -text 2>/dev/null | grep -m1 -E 'ASN1 OID|NIST CURVE' || true)"
          case "$curve" in
            *prime256v1*|*P-256*) ;;
            *)
              echo "::error::The key must be the EC prime256v1 key App Store Connect issues, but this one is: ${curve:-not an EC key}"
              exit 1
              ;;
          esac

          chmod 600 "$KEY_PATH"
          rm -rf "$work"
          echo "The API key is a valid prime256v1 private key (${#match} base64 characters)."

      - name: Materialize Config/Secrets.xcconfig
        env:
          IOS_BEARER_TOKEN: ${{ secrets.IOS_BEARER_TOKEN }}
          WATCH_BEARER_TOKEN: ${{ secrets.WATCH_BEARER_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          if [ -z "$IOS_BEARER_TOKEN" ] || [ -z "$WATCH_BEARER_TOKEN" ]; then
            # These are not build settings the project can supply for itself. They are generated per
            # deployment and shared with the backend out of band, which is why Config/Secrets.xcconfig
            # is ignored by Git and why no copy of them exists anywhere in the tree or its history.
            echo '::error::A Release build needs IOS_BEARER_TOKEN and WATCH_BEARER_TOKEN as repository secrets.'
            echo '::error::They are not in this repository on purpose: Config/Secrets.xcconfig is gitignored (see README, "Local configuration").'
            echo '::error::Set both from the same Config/Secrets.xcconfig used when the backend was deployed, so the app and the server accept each other.'
            exit 1
          fi
          for token in "$IOS_BEARER_TOKEN" "$WATCH_BEARER_TOKEN"; do
            if [ "${#token}" -lt 32 ]; then
              echo '::error::The bearer tokens must each be at least 32 characters.'
              exit 1
            fi
            case "$token" in
              *[[:space:]]*) echo '::error::Bearer tokens must not contain whitespace.'; exit 1 ;;
            esac
          done
          printf 'IOS_BEARER_TOKEN = %s\nWATCH_BEARER_TOKEN = %s\n' "$IOS_BEARER_TOKEN" "$WATCH_BEARER_TOKEN" > Config/Secrets.xcconfig
          echo 'Config/Secrets.xcconfig written.'

      # The project pins manual signing in its Release configurations, so automatic signing is turned on
      # from the command line and the pinned profile names are cleared. Xcode then asks App Store Connect
      # for the certificate and the profiles with this API key and signs both bundles, phone and watch.
      - name: Archive with automatic signing
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -euo pipefail
          mkdir -p archives
          xcodebuild \
            -project WiFiSecureCall.xcodeproj \
            -scheme WiFiSecureCall \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE" \
            -derivedDataPath DerivedData \
            CURRENT_PROJECT_VERSION="$(( BUILD_NUMBER + 100 ))" \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            -allowProvisioningUpdates \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            archive | tee /tmp/archive.log

      - name: Verify both apps are signed
        run: |
          set -euo pipefail
          iphone_app="$(find "$ARCHIVE/Products/Applications" -maxdepth 1 -name '*.app' -print -quit)"
          [ -n "$iphone_app" ] || { echo '::error::no iPhone .app inside the archive.'; exit 1; }
          watch_app="$(find "$iphone_app/Watch" -maxdepth 1 -name '*.app' -print -quit)"
          [ -n "$watch_app" ] || { echo '::error::the archive has no embedded Apple Watch app.'; exit 1; }
          for app in "$iphone_app" "$watch_app"; do
            [ -d "$app/_CodeSignature" ] || { echo "::error::$app is not signed."; exit 1; }
            [ -f "$app/embedded.mobileprovision" ] || { echo "::error::$app has no embedded provisioning profile."; exit 1; }
            identifier="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")"
            revision="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist")"
            echo "signed: $identifier build $revision"
          done

      - name: Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key>
            <string>upload</string>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
            <key>uploadAPIKey</key>
            <dict>
              <key>keyID</key>
              <string>$KEY_ID</string>
              <key>issuerID</key>
              <string>$ISSUER_ID</string>
              <key>keyPath</key>
              <string>$KEY_PATH</string>
            </dict>
          </dict>
          </plist>
          PLIST
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"

          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            | tee /tmp/testflight-upload.log

          grep -qE 'Upload succeeded|Delivered your binary|UPLOAD SUCCEEDED' /tmp/testflight-upload.log \
            || { echo '::error::the TestFlight upload did not report success.'; exit 1; }
          echo 'Submitted to TestFlight.'

      - name: Remove the API key from the workspace
        if: always()
        run: |
          rm -rf appstoreconnect "$RUNNER_TEMP/appstoreconnect" "$RUNNER_TEMP/export"
          echo 'Removed the local copy of the API key.'

  summary:
    name: Summary
    needs: [validate, package, publish, testflight]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -euo pipefail
          validate='${{ needs.validate.result }}'
          package='${{ needs.package.result }}'
          testflight='${{ needs.testflight.result }}'
          configuration='${{ needs.package.outputs.configuration }}'
          version='${{ needs.package.outputs.version }}'
          build='${{ needs.package.outputs.build_number }}'
          artifact='${{ needs.package.outputs.artifact }}'
          {
            echo '### WiFi Secure Call build'
            echo
            echo "- Compile check: $validate"
            echo "- Bundle: $package"
            if [ "$package" = success ]; then
              echo "- Artifact: \`$artifact\` ($configuration configuration, unsigned)"
              if [ -n "$version" ]; then
                echo "- Version: $version, build $build"
              fi
              echo '- Install note: unsigned, re-sign with your own certificate before putting it on a device.'
            fi
            if [ "$testflight" != skipped ]; then
              echo "- TestFlight: $testflight"
            fi
          } >> "$GITHUB_STEP_SUMMARY"