name: Xcode 27 SDK API Probe

on:
  push:
    branches:
      - probe/xcode27-sdk-20260925

permissions:
  contents: read

jobs:
  sdk-probe:
    runs-on: xcode-27
    timeout-minutes: 3
    steps:
      - name: Inspect Xcode 27 and iOS 27 public audio APIs
        shell: bash
        run: |
          set -euo pipefail

          echo "=== TOOLCHAIN ==="
          sw_vers
          xcodebuild -version
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "IOS_SDK_PATH=$SDK"
          echo "IOS_SDK_VERSION=$(xcrun --sdk iphoneos --show-sdk-version)"

          PATTERN='MediaDeviceExtension|realtimeAudioStreaming|mediaDeviceExtension|MicrophoneInjection|microphoneInjection|TelephonyConversationManager|StartCellularConversationAction|LiveAssistanceExtension|AVAudioSessionPort|AudioAccessory|HFP|handsFree|hands-free'

          echo "=== FRAMEWORK SYMBOL PROBE ==="
          for FW in MediaDevice AVFAudio AVFoundation AVSystemRouting LiveCommunicationKit AudioAccessoryKit AccessorySetupKit ExternalAccessory; do
            DIR="$SDK/System/Library/Frameworks/$FW.framework"
            echo "--- $FW ---"
            if [ ! -d "$DIR" ]; then
              echo "FRAMEWORK_NOT_PRESENT"
              continue
            fi
            FOUND=0
            for SUB in Modules Headers; do
              if [ -e "$DIR/$SUB" ]; then
                OUT="$(grep -R -n -E "$PATTERN" "$DIR/$SUB" 2>/dev/null | head -n 180 || true)"
                if [ -n "$OUT" ]; then
                  FOUND=1
                  printf '%s\n' "$OUT"
                fi
              fi
            done
            if [ "$FOUND" -eq 0 ]; then
              echo "NO_MATCHING_PUBLIC_SYMBOLS"
            fi
          done

          echo "=== EXACT mediaDeviceExtension occurrences ==="
          for FW in MediaDevice AVFAudio AVFoundation AVSystemRouting; do
            DIR="$SDK/System/Library/Frameworks/$FW.framework"
            [ -d "$DIR" ] || continue
            grep -R -n -i 'mediaDeviceExtension' "$DIR/Modules" "$DIR/Headers" 2>/dev/null | head -n 120 || true
          done

          echo "=== DONE ==="
